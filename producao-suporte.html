<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produção do Suporte Técnico | Arroba Banda Larga</title>
<style>
:root{
  --azul:#0b2a4a; --azul2:#123a63; --azul3:#1b4f85; --ciano:#0e9f9f; --ciano2:#12b8b8;
  --laranja:#e8792b; --amarelo:#e0a800; --vermelho:#c0392b; --verde:#1e9e6a;
  --cinza:#f4f6f9; --cinza2:#e6ebf1; --texto:#1d2b3a; --mudo:#6b7c8f; --branco:#fff;
  --sombra:0 1px 2px rgba(16,38,60,.08),0 8px 24px rgba(16,38,60,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--cinza);color:var(--texto);font-size:14px;-webkit-font-smoothing:antialiased}
.layout{display:flex;min-height:100vh}
aside{width:236px;background:var(--azul);color:#cfe0f0;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.marca{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.marca b{display:block;color:#fff;font-size:14px;letter-spacing:.02em}
.marca span{display:block;font-size:11px;color:#8fb3d4;margin-top:3px;letter-spacing:.08em;text-transform:uppercase}
nav{padding:10px 8px;overflow-y:auto;flex:1}
nav button{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;color:#c3d6e8;
  padding:9px 11px;border-radius:7px;font-size:13px;cursor:pointer;text-align:left;font-family:inherit;margin-bottom:2px}
nav button:hover{background:rgba(255,255,255,.07);color:#fff}
nav button.on{background:var(--azul3);color:#fff;font-weight:600}
nav button i{font-style:normal;width:16px;text-align:center;opacity:.85;font-size:13px}
nav .grp{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#6f93b5;padding:14px 12px 5px}
.badge{background:var(--laranja);color:#fff;border-radius:9px;font-size:10px;padding:1px 6px;margin-left:auto;font-weight:700}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{background:var(--branco);border-bottom:1px solid var(--cinza2);padding:14px 22px;position:sticky;top:0;z-index:20}
.topo{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.topo h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
.topo .sub{font-size:11.5px;color:var(--mudo);margin-top:2px}
.status{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--mudo);
  background:var(--cinza);border:1px solid var(--cinza2);padding:6px 11px;border-radius:20px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--verde);box-shadow:0 0 0 3px rgba(30,158,106,.15)}
.filtros{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px;align-items:flex-end}
.campo{display:flex;flex-direction:column;gap:3px}
.campo label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mudo);font-weight:600}
.campo input,.campo select{font-family:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--cinza2);
  border-radius:6px;background:var(--branco);color:var(--texto);min-width:120px}
.campo input:focus,.campo select:focus{outline:2px solid rgba(14,159,159,.25);border-color:var(--ciano)}
.limpar{font-size:12px;color:var(--azul3);background:none;border:0;cursor:pointer;padding:7px 4px;font-family:inherit;text-decoration:underline}
section{padding:20px 22px 40px;display:none}
section.on{display:block}
h2.sec{font-size:14px;font-weight:650;margin:0 0 12px;letter-spacing:-.01em}
h2.sec small{font-weight:400;color:var(--mudo);font-size:11.5px;margin-left:8px;letter-spacing:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--branco);border:1px solid var(--cinza2);border-radius:10px;padding:13px 15px;box-shadow:var(--sombra)}
.card .rot{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mudo);font-weight:600}
.card .val{font-size:25px;font-weight:680;margin-top:5px;letter-spacing:-.02em;line-height:1.1}
.card .pe{font-size:11px;color:var(--mudo);margin-top:3px}
.card.a{border-top:3px solid var(--azul3)}
.card.b{border-top:3px solid var(--ciano)}
.card.c{border-top:3px solid var(--laranja)}
.card.d{border-top:3px solid var(--amarelo)}
.card.e{border-top:3px solid var(--verde)}
.card.f{border-top:3px solid var(--vermelho)}
.card.g{border-top:3px solid #7a5cd6}
.painel{background:var(--branco);border:1px solid var(--cinza2);border-radius:10px;box-shadow:var(--sombra);
  margin-bottom:16px;overflow:hidden}
.painel .cab{padding:12px 15px;border-bottom:1px solid var(--cinza2);display:flex;justify-content:space-between;
  align-items:center;gap:10px;flex-wrap:wrap}
.painel .cab b{font-size:13px;font-weight:640}
.painel .cab span{font-size:11.5px;color:var(--mudo)}
.rol{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:#f8fafc;text-align:left;padding:9px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--mudo);font-weight:700;border-bottom:1px solid var(--cinza2);white-space:nowrap;cursor:pointer;user-select:none}
th.num,td.num{text-align:right}
th:hover{color:var(--azul3)}
td{padding:9px 12px;border-bottom:1px solid #f0f3f7;vertical-align:middle}
tbody tr:hover{background:#fafcfe}
tfoot td{font-weight:700;background:#f8fafc;border-top:2px solid var(--cinza2)}
.tag{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10.5px;font-weight:600;white-space:nowrap}
.t-ok{background:rgba(30,158,106,.12);color:#177a52}
.t-nova{background:rgba(27,79,133,.12);color:var(--azul3)}
.t-reag{background:rgba(122,92,214,.14);color:#5b41b5}
.t-pend{background:rgba(232,121,43,.14);color:#b95d19}
.t-fora{background:rgba(107,124,143,.14);color:#4d5f72}
.t-div{background:rgba(192,57,43,.12);color:#a5322a}
.link{color:var(--azul3);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.link:hover{color:var(--ciano)}
.barra{height:9px;border-radius:5px;background:var(--cinza2);overflow:hidden;min-width:70px}
.barra i{display:block;height:100%;border-radius:5px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mudo);padding:10px 15px;border-top:1px solid var(--cinza2)}
.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.graf{padding:14px 15px}
.graf svg{width:100%;height:auto;display:block}
.vazio{padding:30px;text-align:center;color:var(--mudo);font-size:13px}
.dica{font-size:11.5px;color:var(--mudo);line-height:1.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
@media(max-width:820px){
  aside{position:fixed;left:-240px;top:0;z-index:60;transition:left .2s}
  aside.aberto{left:0;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .menu-btn{display:inline-flex !important}
  section{padding:16px 14px 40px}
  header{padding:12px 14px}
}
.menu-btn{display:none;align-items:center;gap:6px;background:var(--azul);color:#fff;border:0;border-radius:6px;
  padding:7px 11px;font-size:12px;cursor:pointer;font-family:inherit}
.sobrepor{position:fixed;inset:0;background:rgba(11,42,74,.45);z-index:55;display:none}
.sobrepor.on{display:block}
/* modal */
.modal{position:fixed;inset:0;background:rgba(11,42,74,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal .cx{background:var(--branco);border-radius:12px;width:min(1180px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.modal .cx header{position:static;padding:14px 18px;border-bottom:1px solid var(--cinza2)}
.modal .cx header b{font-size:14px}
.modal .cx header .x{background:none;border:0;font-size:20px;color:var(--mudo);cursor:pointer;line-height:1;padding:0 4px}
.modal .corpo{overflow:auto}
.aviso{background:rgba(232,121,43,.08);border:1px solid rgba(232,121,43,.25);color:#8a4a12;border-radius:8px;
  padding:10px 13px;font-size:12px;line-height:1.5;margin-bottom:14px}
.ok{background:rgba(30,158,106,.07);border:1px solid rgba(30,158,106,.22);color:#156845;border-radius:8px;
  padding:10px 13px;font-size:12px;line-height:1.5;margin-bottom:14px}
ul.lst{margin:6px 0 0;padding-left:18px;font-size:12.5px;line-height:1.7;color:#33475b}
</style>
</head>

function diaDe(r){ return S.base==='abertura' ? r.dAb.slice(0,10) : (r.dProd||r.dAb).slice(0,10); }

function filtra(){
  return R.filter(r=>{
    const d = diaDe(r);
    if(S.de && d < S.de) return false;
    if(S.ate && d > S.ate) return false;
    if(S.colab!=='' && String(r.colIdx)!==S.colab) return false;
    if(S.assunto!=='' && String(r.assIdx)!==S.assunto) return false;
    if(S.proc!=='' && String(r.procIdx)!==S.proc) return false;
    return true;
  });
}
function producao(){ return filtra().filter(r=>r.st==='PRODUCAO'); }
function pendencias(){ return filtra().filter(r=>r.st!=='PRODUCAO'); }

function filtraAud(){
  return AUD.filter(a=>{
    const d=(a.dataOs||'').slice(0,10);
    if(S.de && d<S.de) return false;
    if(S.ate && d>S.ate) return false;
    if(S.colab!=='' && a.credito!==COLAB[Number(S.colab)]) return false;
    if(S.proc!=='' && String(a.procIdx)!==S.proc) return false;
    if(S.assunto!=='' && ASS[Number(S.assunto)] && a.atend) return false;
    return true;
  });
}
function kpisAud(){
  const a=filtraAud();
  const enc=a.filter(x=>x.statusOs==='F');
  const ind=x=>x.sugestao!=='O.S. necessária (sem indício)';
  const evit=a.filter(x=>x.sugestao==='O.S. potencialmente evitável');
  const conf=a.filter(x=>x.classif==='O.S. evitável confirmada'||x.classif==='Falha de diagnóstico confirmada');
  const audit=a.filter(x=>x.classif && x.classif!=='Aguardando análise da supervisão' && x.classif!=='Aguardando conclusão da manutenção');
  return {total:a.length, encerradas:enc.length, indicios:a.filter(ind).length, evit:evit.length,
    confirmadas:conf.length, auditadas:audit.length,
    cobertura:a.length? audit.length/a.length*100 : null};
}
function kpis(){
  const p = producao();
  const semOs = p.filter(r=>r.cls==='FINALIZADO_SEM_OS').length;
  const novas = p.filter(r=>r.cls==='NOVA_OS').length;
  const reag  = p.filter(r=>r.cls==='VISITA_REAGENDADA').length;
  const total = semOs+novas+reag;
  return {semOs, novas, reag, total, os:novas+reag, pctEnc: total? (novas+reag)/total*100 : null,
          pctNovas: total? novas/total*100 : null};
}
function porDia(){
  const m = new Map();
  filtra().forEach(r=>{
    const d = diaDe(r); if(!m.has(d)) m.set(d,{dia:d,semOs:0,novas:0,reag:0,pend:0,total:0});
    const x = m.get(d);
    if(r.st==='PRODUCAO'){
      if(r.cls==='FINALIZADO_SEM_OS') x.semOs++;
      else if(r.cls==='NOVA_OS') x.novas++;
      else x.reag++;
      x.total++;
    } else x.pend++;
  });
  return [...m.values()].sort((a,b)=>a.dia<b.dia?-1:1);
}
function porColab(){
  const m = new Map();
  producao().forEach(r=>{
    const k = r.colIdx>=0 ? r.colIdx : -1;
    if(!m.has(k)) m.set(k,{k,nome:r.colIdx>=0?COLAB[r.colIdx]:r.credito,semOs:0,novas:0,reag:0,
      cat:{},total:0});
    const x=m.get(k);
    if(r.cls==='FINALIZADO_SEM_OS') x.semOs++;
    else if(r.cls==='NOVA_OS'){ x.novas++; x.cat[r.cat||'—']=(x.cat[r.cat||'—']||0)+1; }
    else { x.reag++; x.cat['Reagendado']=(x.cat['Reagendado']||0)+1; }
    x.total++;
  });
  return [...m.values()].sort((a,b)=>b.total-a.total);
}
function porCategoria(){
  const c = {}; producao().forEach(r=>{
    if(r.cls==='FINALIZADO_SEM_OS') return;
    const k = r.cls==='VISITA_REAGENDADA' ? 'Reagendado' : (r.cat||'—');
    c[k]=(c[k]||0)+1;
  });
  return c;
}

/* ---------- gráficos ---------- */
function grafEmpilhado(dias, altura=210){
  if(!dias.length) return '<div class="vazio">Sem dados no período selecionado.</div>';
  const w=Math.max(560, dias.length*46), h=altura, pad={t:12,r:8,b:34,l:34};
  const max = Math.max(1, ...dias.map(d=>d.semOs+d.novas+d.reag));
  const bw = Math.min(30,(w-pad.l-pad.r)/dias.length*0.62);
  const y = v => h-pad.b-(v/max)*(h-pad.t-pad.b);
  let s=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img">`;
  for(let i=0;i<=3;i++){
    const v=Math.round(max*i/3), yy=y(v);
    s+=`<line x1="${pad.l}" y1="${yy}" x2="${w-pad.r}" y2="${yy}" stroke="#eef2f6"/>`;
    s+=`<text x="${pad.l-6}" y="${yy+3.5}" text-anchor="end" font-size="9" fill="#8496a8">${v}</text>`;
  }
  dias.forEach((d,i)=>{
    const cx = pad.l + (w-pad.l-pad.r)*(i+0.5)/dias.length;
    let base = h-pad.b;
    [['semOs','#1b4f85'],['novas','#0e9f9f'],['reag','#7a5cd6']].forEach(([k,c])=>{
      const v=d[k]; if(!v) return;
      const hh=(v/max)*(h-pad.t-pad.b);
      s+=`<rect x="${cx-bw/2}" y="${base-hh}" width="${bw}" height="${hh}" fill="${c}" rx="1.5"/>`;
      base-=hh;
    });
    const passo = dias.length>20?3:1;
    if(i%passo===0) s+=`<text x="${cx}" y="${h-14}" text-anchor="middle" font-size="9" fill="#8496a8">${d.dia.slice(8,10)}/${d.dia.slice(5,7)}</text>`;
  });
  return s+'</svg>';
}
function grafCategorias(c){
  const itens = Object.entries(c).filter(([k])=>k!=='—').sort((a,b)=>b[1]-a[1]);
  const outros = Object.entries(c).filter(([k])=>k==='—').reduce((s,x)=>s+x[1],0);
  if(outros) itens.push(['Sem categoria', outros]);
  if(!itens.length) return '<div class="vazio">Nenhuma O.S. no período.</div>';
  const max=Math.max(...itens.map(i=>i[1]));
  return '<div style="padding:4px 0">'+itens.map(([k,v])=>`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
      <div style="width:150px;font-size:12px;color:#33475b">${esc(k)}</div>
      <div class="barra" style="flex:1"><i style="width:${(v/max*100).toFixed(1)}%;background:${CAT_COR[k]||'#6b7c8f'}"></i></div>
      <div style="width:38px;text-align:right;font-size:12px;font-weight:650">${nf(v)}</div>
    </div>`).join('')+'</div>';
}

/* ---------- tabelas ---------- */
function ordena(rows, chave, def){
  const o = S.ord[chave] || def;
  const [campo,dir] = o.split(':');
  return rows.slice().sort((a,b)=>{
    let x=a[campo], y=b[campo];
    if(typeof x==='string'||typeof y==='string'){ x=String(x||''); y=String(y||''); return dir==='asc'?x.localeCompare(y):y.localeCompare(x); }
    return dir==='asc'? (x||0)-(y||0) : (y||0)-(x||0);
  });
}
function th(chave,campo,rot,extra=''){
  const o=(S.ord[chave]||'').split(':');
  const seta = o[0]===campo ? (o[1]==='asc'?' ▲':' ▼') : '';
  return `<th class="${extra}" onclick="ordenaPor('${chave}','${campo}')">${rot}${seta}</th>`;
}
function ordenaPor(chave,campo){
  const atual=(S.ord[chave]||'total:desc').split(':');
  const dir = atual[0]===campo && atual[1]==='desc' ? 'asc':'desc';
  S.ord[chave]=campo+':'+dir; render();
}

    if(!porProc.has(k)) porProc.set(k,{k,nome:k>=0?PROC[k].nome:'—',cat:k>=0?PROC[k].cat:'—',q:0,reag:0});

        <div class="rol"><table><thead><tr><th>Processo</th><th>Categoria</th><th class="num">O.S.</th><th class="num">Reagend.</th></tr></thead><tbody>
        ${lista.map(p=>`<tr><td>${p.k>=0?'<b>'+p.k+'</b> · ':''}${esc(p.nome)}</td><td>${esc(p.cat)}</td>

        </tbody></table></div></div>
    </div>
    <div class="painel"><div class="cab"><b>O.S. por dia e categoria</b><span>a categoria Reagendado não soma na original</span></div>
      <div class="rol"><table><thead><tr><th>Dia</th>${CATS.map(c=>`<th class="num">${c}</th>`).join('')}<th class="num">Total</th></tr></thead><tbody>
      ${(()=>{const m=new Map();

  </section>`;
}

function vQualidade(){
  const a=filtraAud();
  const m=new Map();
  a.forEach(x=>{
    const k=x.credito||'—';
    if(!m.has(k)) m.set(k,{nome:k,os:0,ind:0,evit:0,imp:0,diagInc:0,conf:0,aud:0});
    const c=m.get(k); c.os++;
    if(x.sugestao!=='O.S. necessária (sem indício)') c.ind++;
    if(x.sugestao==='O.S. potencialmente evitável') c.evit++;
    if((x.sinais||'').indexOf('VISITA_IMPRODUTIVA')>=0) c.imp++;
    if((x.sinais||'').indexOf('DIAGNOSTICO_INCOMPLETO')>=0) c.diagInc++;
    if(x.classif==='O.S. evitável confirmada'||x.classif==='Falha de diagnóstico confirmada') c.conf++;
    if(x.classif && x.classif.indexOf('Aguardando')!==0) c.aud++;
  });
  const lista=[...m.values()].sort((x,y)=>y.os-x.os);
  const t=lista.reduce((s,c)=>({os:s.os+c.os,ind:s.ind+c.ind,evit:s.evit+c.evit,imp:s.imp+c.imp,
    diagInc:s.diagInc+c.diagInc,conf:s.conf+c.conf,aud:s.aud+c.aud}),{os:0,ind:0,evit:0,imp:0,diagInc:0,conf:0,aud:0});
  return `<section class="on">
    <h2 class="sec">Qualidade por colaborador <small>volume separado de qualidade · indícios, não falhas confirmadas</small></h2>
    <div class="aviso">Uma taxa alta de indício não significa baixo desempenho: depende do tipo de caso e da complexidade da fila. A coluna de confirmadas é a única que representa falha validada pela supervisão.</div>
    <div class="painel"><div class="rol"><table><thead><tr>
      <th>Colaborador</th><th class="num">O.S. geradas</th><th class="num">Com indício</th>
      <th class="num">% indício</th><th class="num">Pot. evitáveis</th><th class="num">Visitas improdutivas</th>
      <th class="num">Diag. incompleto</th><th class="num">Auditadas</th><th class="num">Confirmadas</th>
      <th class="num">Taxa de falha</th></tr></thead><tbody>
      ${lista.map(c=>`<tr><td><b>${esc(c.nome)}</b></td><td class="num">${nf(c.os)}</td>
        <td class="num">${nf(c.ind)}</td><td class="num">${pc(c.ind,c.os)}</td>
        <td class="num">${nf(c.evit)}</td><td class="num">${nf(c.imp)}</td><td class="num">${nf(c.diagInc)}</td>
        <td class="num">${nf(c.aud)}</td><td class="num">${nf(c.conf)}</td>
        <td class="num">${c.aud?pc(c.conf,c.aud):'—'}</td></tr>`).join('')||'<tr><td colspan="10" class="vazio">Sem dados.</td></tr>'}
      </tbody><tfoot><tr><td>Total</td><td class="num">${nf(t.os)}</td><td class="num">${nf(t.ind)}</td>
        <td class="num">${pc(t.ind,t.os)}</td><td class="num">${nf(t.evit)}</td><td class="num">${nf(t.imp)}</td>
        <td class="num">${nf(t.diagInc)}</td><td class="num">${nf(t.aud)}</td><td class="num">${nf(t.conf)}</td>
        <td class="num">${t.aud?pc(t.conf,t.aud):'—'}</td></tr></tfoot></table></div></div>
    <div class="dica">Taxa de falha = confirmadas ÷ O.S. efetivamente auditadas. Sem auditoria registrada, exibe “—”.</div>
  </section>`;
}

function vOport(){
  const al=ALERTAS_M.slice().sort((a,b)=>(a.nivel==='Alto'?0:1)-(b.nivel==='Alto'?0:1));
  const pend=al.filter(x=>x.status==='Novo'||x.status==='Em análise').length;
  return `<section class="on">
    <h2 class="sec">Central de oportunidades de melhoria <small>${nf(pend)} alerta(s) em aberto</small></h2>
    <div class="cards">
      <div class="card f"><div class="rot">Alertas de nível alto</div><div class="val">${nf(al.filter(x=>x.nivel==='Alto').length)}</div></div>
      <div class="card d"><div class="rot">Nível médio</div><div class="val">${nf(al.filter(x=>x.nivel==='Médio').length)}</div></div>
      <div class="card a"><div class="rot">Total gerado</div><div class="val">${nf(al.length)}</div></div>
      <div class="card e"><div class="rot">Em aberto</div><div class="val">${nf(pend)}</div></div>
    </div>
    <div class="painel"><div class="cab"><b>Alertas e critério que os gerou</b><span>regra configurável, sempre com evidência</span></div>
      <div class="rol"><table><thead><tr><th>Nível</th><th>Tipo</th><th>Escopo</th><th>Critério</th><th>Evidências</th><th>Status</th></tr></thead><tbody>
      ${al.map(x=>`<tr><td><span class="tag ${x.nivel==='Alto'?'t-div':'t-pend'}">${esc(x.nivel)}</span></td>
        <td>${esc(x.tipo)}</td><td>${esc(x.escopo)}</td><td style="max-width:280px">${esc(x.criterio)}</td>
        <td style="max-width:300px;font-size:11px">${esc((x.evidencias||'').slice(0,220))}</td>
        <td>${esc(x.status)}</td></tr>`).join('')||'<tr><td colspan="6" class="vazio">Nenhum alerta no período.</td></tr>'}
      </tbody></table></div></div>
  </section>`;
}

function vPlanos(){
  const st=['Pendente','Em andamento','Concluído','Em reavaliação','Cancelado'];
  return `<section class="on">
    <h2 class="sec">Planos de ação e feedbacks <small>acompanhamento da supervisão</small></h2>
    <div class="cards">${st.map((s,i)=>`<div class="card ${['c','a','e','d','g'][i]}">
      <div class="rot">${s}</div><div class="val">${nf(PLANOS.filter(p=>p.status===s).length)}</div></div>`).join('')}</div>
    <div class="painel"><div class="cab"><b>Planos de ação</b><span>${nf(PLANOS.length)} planos</span></div>
      <div class="rol"><table><thead><tr><th>Problema</th><th>Ação</th><th>Responsável</th><th>Prazo</th>
        <th>Status</th><th>Antes</th><th>Depois</th><th>Conclusão</th></tr></thead><tbody>
        ${PLANOS.map(p=>`<tr><td style="max-width:240px">${esc(p.problema||p.titulo||'')}</td>
          <td style="max-width:260px">${esc(p.acao||'')}</td><td>${esc(p.responsavel||'—')}</td>
          <td>${p.prazo?dbr(p.prazo.slice(0,10)):'—'}</td><td><span class="tag t-nova">${esc(p.status||'')}</span></td>
          <td class="num">${p.valor_antes===null||p.valor_antes===undefined?'—':nf(p.valor_antes)}</td>
          <td class="num">${p.valor_depois===null||p.valor_depois===undefined?'—':nf(p.valor_depois)}</td>
          <td>${esc(p.conclusao||'—')}</td></tr>`).join('')||'<tr><td colspan="8" class="vazio">Nenhum plano registrado ainda.</td></tr>'}
      </tbody></table></div></div>
    <div class="painel"><div class="cab"><b>Orientações e feedbacks</b><span>acesso restrito à supervisão</span></div>
      <div class="rol"><table><thead><tr><th>Data</th><th>Colaborador</th><th>Tipo</th><th>Descrição</th><th>Supervisor</th><th>Origem</th></tr></thead><tbody>
        ${FEEDBACKS.map(f=>`<tr><td>${dbr((f.data||'').slice(0,10))}</td><td>${esc(f.colaborador_nome||'')}</td>
          <td>${esc(f.tipo||'')}</td><td style="max-width:320px">${esc(f.descricao||'')}</td>
          <td>${esc(f.supervisor||'—')}</td><td>${esc(f.origem||'—')}</td></tr>`).join('')||'<tr><td colspan="6" class="vazio">Nenhum feedback registrado ainda.</td></tr>'}
      </tbody></table></div></div>
    <div class="ok">Para registrar uma decisão de auditoria, um plano de ação ou um feedback, peça à Aria: ela grava nas entidades do Base44 com autor, data e justificativa, e o painel é regenerado.</div>
  </section>`;
}

/* ---------- navegação ---------- */

/* ---------- TOP ASSUNTOS ---------- */
function vTop(){
  const P = producao(), tot = P.length;
  const m = new Map();
  P.forEach(r=>{
    if(!m.has(r.assIdx)) m.set(r.assIdx,{idx:r.assIdx,n:0,sem:0,nova:0,reag:0});
    const x = m.get(r.assIdx);
    x.n++;
    if(r.cls==='FINALIZADO_SEM_OS') x.sem++;
    else if(r.cls==='NOVA_OS') x.nova++;
    else x.reag++;
  });
  const arr = [...m.values()].filter(x=>ASS[x.idx]).map(x=>Object.assign(x,{ass:ASS[x.idx]}));
  const os = x => x.nova + x.reag;
  const topN = arr.slice().sort((a,b)=>b.n-a.n).slice(0,10);
  const topOs = arr.slice().sort((a,b)=>os(b)-os(a)||b.n-a.n).slice(0,10);
  const topSem = arr.slice().sort((a,b)=>b.sem-a.sem).slice(0,10);
  const topCol = porColab().slice().sort((a,b)=>b.novas-a.novas||b.total-a.total).slice(0,10);
  const maxN = topN.length?topN[0].n:1, maxOs = topOs.length?os(topOs[0]):1;

  const barra = (v,mx) => '<div style="background:#e6ebf1;border-radius:3px;height:8px;width:100%"><div style="width:'+Math.max(2,v/mx*100)+'%;height:8px;border-radius:3px;background:#1b4f85"></div></div>';

  const linhaN = (x,i) => '<tr><td class="num">'+(i+1)+'</td><td><b>'+esc(x.ass.id)+'</b> · '+esc(x.ass.desc)+'</td>'+
    '<td class="num"><b>'+nf(x.n)+'</b></td><td class="num">'+pc(x.n,tot)+'</td><td style="width:120px">'+barra(x.n,maxN)+'</td>'+
    '<td class="num">'+nf(x.sem)+'</td><td class="num">'+nf(x.nova)+'</td><td class="num">'+nf(x.reag)+'</td></tr>';

  const linhaOs = (x,i) => '<tr><td class="num">'+(i+1)+'</td><td><b>'+esc(x.ass.id)+'</b> · '+esc(x.ass.desc)+'</td>'+
    '<td class="num"><b>'+nf(os(x))+'</b></td><td class="num">'+nf(x.nova)+'</td><td class="num">'+nf(x.reag)+'</td>'+
    '<td class="num">'+pc(os(x),x.n)+'</td><td style="width:120px">'+barra(os(x),maxOs)+'</td></tr>';

  return '<div class="cards">'+
    card('Atendimentos no período',nf(tot),'base filtrada')+
    card('Assuntos distintos',nf(arr.length),'de 112 do escopo')+
    card('O.S. geradas',nf(arr.reduce((s,x)=>s+os(x),0)),'novas + reagendadas')+
    card('Assunto líder',arr.length?esc(arr.slice().sort((a,b)=>b.n-a.n)[0].ass.id):'—','maior volume')+
    '</div>'+
    '<div class="grid2">'+
    '<div class="box"><h3>Top 10 assuntos por atendimentos</h3><div class="tbl"><table><thead><tr><th>#</th><th>Assunto</th><th class="num">Atend.</th><th class="num">% do total</th><th></th><th class="num">Sem O.S.</th><th class="num">Novas O.S.</th><th class="num">Reag.</th></tr></thead><tbody>'+
    (topN.length?topN.map(linhaN).join(''):'<tr><td colspan="8" class="vazio">Sem dados no filtro</td></tr>')+'</tbody></table></div></div>'+
    '<div class="box"><h3>Top 10 assuntos que mais geraram O.S.</h3><div class="tbl"><table><thead><tr><th>#</th><th>Assunto</th><th class="num">O.S.</th><th class="num">Novas</th><th class="num">Reag.</th><th class="num">% encam.</th><th></th></tr></thead><tbody>'+
    (topOs.length?topOs.map(linhaOs).join(''):'<tr><td colspan="7" class="vazio">Sem dados no filtro</td></tr>')+'</tbody></table></div></div>'+
    '</div>'+
    '<div class="grid2">'+
    '<div class="box"><h3>Top 10 assuntos finalizados sem O.S.</h3><div class="tbl"><table><thead><tr><th>#</th><th>Assunto</th><th class="num">Sem O.S.</th><th class="num">% do total</th></tr></thead><tbody>'+
    (topSem.length?topSem.map((x,i)=>'<tr><td class="num">'+(i+1)+'</td><td><b>'+esc(x.ass.id)+'</b> · '+esc(x.ass.desc)+'</td><td class="num"><b>'+nf(x.sem)+'</b></td><td class="num">'+pc(x.sem,tot)+'</td></tr>').join(''):'<tr><td colspan="4" class="vazio">Sem dados no filtro</td></tr>')+'</tbody></table></div></div>'+
    '<div class="box"><h3>Top 10 colaboradores que mais abriram O.S.</h3><div class="tbl"><table><thead><tr><th>#</th><th>Colaborador</th><th class="num">Novas O.S.</th><th class="num">Reag.</th><th class="num">Total O.S.</th><th class="num">% do total</th></tr></thead><tbody>'+
    (topCol.length?topCol.map((c,i)=>'<tr><td class="num">'+(i+1)+'</td><td>'+esc(c.nome)+'</td><td class="num"><b>'+nf(c.novas)+'</b></td><td class="num">'+nf(c.reag)+'</td><td class="num">'+nf(c.novas+c.reag)+'</td><td class="num">'+pc(c.novas+c.reag,arr.reduce((s,x)=>s+os(x),0))+'</td></tr>').join(''):'<tr><td colspan="6" class="vazio">Sem dados no filtro</td></tr>')+'</tbody></table></div></div>'+
    '</div>';
}

const MENU=[
  ['dashboard','Dashboard Operacional','▦'],['diaria','Produção Diária','▤'],
  ['colaborador','Produção por Colaborador','☰'],['top','Top Assuntos','★'],['processo','Distribuição por Processo','◔'],
  ['mov','Movimentação de Atendimentos','⇄'],['pend','Pendências e Conferência','⚑'],
  ['auditoria','Auditoria de O.S.','⚖'],['reinc','Reincidência','⟳'],
  ['qualidade','Qualidade por Colaborador','◎'],['oport','Oportunidades de Melhoria','✦'],
  ['planos','Planos de Ação e Feedbacks','✓'],
  ['hist','Histórico e Auditoria','⟲'],['config','Configurações e Sincronização','⚙'],
  ['alertas','Alertas de Cadastro IXC','◉']
];
function vai(v){ S.view=v; fechaMenu(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function abreMenu(){ el('menu').classList.add('aberto'); el('sobrepor').classList.add('on'); }
function fechaMenu(){ el('menu').classList.remove('aberto'); el('sobrepor').classList.remove('on'); }

function renderNav(){
  const alertas=(DADOS.alertas||[]).filter(a=>a.situacao==='Aguardando avaliação').length;
  el('nav').innerHTML = '<div class="grp">Operação</div>' +
    MENU.slice(0,12).map(([k,l,i])=>`<button class="${S.view===k?'on':''}" onclick="vai('${k}')"><i>${i}</i>${l}</button>`).join('') +
    '<div class="grp">Administração</div>' +
    MENU.slice(12).map(([k,l,i])=>`<button class="${S.view===k?'on':''}" onclick="vai('${k}')"><i>${i}</i>${l}${k==='alertas'&&alertas?`<span class="badge">${alertas}</span>`:''}</button>`).join('');
  const t=MENU.find(m=>m[0]===S.view);
  el('titulo').textContent=t?t[1]:'';
}

function render(){
  renderNav();
  const v={dashboard:vDashboard,diaria:vDiaria,colaborador:vColaborador,top:vTop,processo:vProcesso,
    mov:vMov,pend:vPend,auditoria:vAuditoria,reinc:vReinc,qualidade:vQualidade,
    oport:vOport,planos:vPlanos,hist:vHist,config:vConfig,alertas:vAlertas}[S.view];
  el('views').innerHTML=v();
  const s=SYNC[SYNC.length-1];
  el('statusSync').textContent = s ? 'Última sincronização: '+dhbr(s.fim)+' · '+nf(DADOS.total_registros)+' registros' : 'Sem sincronização';
  el('subtitulo').textContent = 'Produção do Suporte Técnico · '+nf(DADOS.total_registros)+' atendimentos no histórico · IXC somente leitura';
}

/* ---------- filtros ---------- */
function montaFiltros(){
  el('fDe').value = S.de = DADOS.periodo.ini;
  el('fAte').value = S.ate = DADOS.periodo.fim;
  el('fColab').innerHTML='<option value="">Todos os 17</option>'+COLAB.map((n,i)=>`<option value="${i}">${esc(n)}</option>`).join('');
  el('fAssunto').innerHTML='<option value="">Todos (${ASS.length})</option>'.replace('${ASS.length}',ASS.length)+
    ASS.slice().sort((a,b)=>a.desc.localeCompare(b.desc)).map(a=>`<option value="${ASS.indexOf(a)}">${a.id} · ${esc(a.desc)}</option>`).join('');
  el('fProc').innerHTML='<option value="">Todos os processos</option>'+PROC.map((p,i)=>`<option value="${i}">${p.id} · ${esc(p.nome)}</option>`).join('');
}
function ligaFiltros(){
  el('fDe').onchange=e=>{S.de=e.target.value;render();};
  el('fAte').onchange=e=>{S.ate=e.target.value;render();};
  el('fColab').onchange=e=>{S.colab=e.target.value;render();};
  el('fAssunto').onchange=e=>{S.assunto=e.target.value;render();};
  el('fProc').onchange=e=>{S.proc=e.target.value;render();};
  el('fBase').onchange=e=>{S.base=e.target.value;render();};
}
function limpaFiltros(){
  S.de=DADOS.periodo.ini; S.ate=DADOS.periodo.fim; S.colab=''; S.assunto=''; S.proc=''; S.base='producao';
  el('fDe').value=S.de; el('fAte').value=S.ate; el('fColab').value=''; el('fAssunto').value='';
  el('fProc').value=''; el('fBase').value='producao'; render();
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ fechaModal(); fechaMenu(); } });
el('modal').addEventListener('click',e=>{ if(e.target.id==='modal') fechaModal(); });

montaFiltros(); ligaFiltros(); render();

</script>
