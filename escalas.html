<script>
/* =========================================================================
   APLICAÇÃO — núcleo e telas
   ========================================================================= */
var App = {
  view: 'dashboard',
  diaSel: hojeISO(),
  mesCal: hojeISO().slice(0,7),
  editandoConf: false,
  editandoColab: null,

  /* ---------------- infra ---------------- */
  init(){
    carregar();
    document.querySelectorAll('.aba').forEach(b=>{
      b.onclick = ()=> this.ir(b.dataset.v);
    });
    document.getElementById('modal').onclick = e=>{
      if(e.target.id==='modal') this.fecharModal();
    };
    if(location.hash.startsWith('#p=')){ this.abrirPublicado(location.hash.slice(3)); return; }
    this.ir('dashboard');
  },
  ir(v){
    this.view = v;
    document.querySelectorAll('.aba').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
    document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on', x.id==='view-'+v));
    const fn = {dashboard:this.dashboard, importar:this.importar, conferencia:this.conferencia,
      colaboradores:this.colaboradores, informativo:this.informativo, sobreaviso:this.sobreaviso,
      publicacoes:this.publicacoes, historico:this.historico}[v];
    if(fn) fn.call(this);
    this.atualizaBadge();
    window.scrollTo({top:0,behavior:'smooth'});
  },
  atualizaBadge(){
    const n = DB.pendentes.filter(p=>p.incluir).length;
    const el = document.getElementById('badgeConf');
    if(el) el.innerHTML = n ? ` <span class="bg am">${n}</span>` : '';
  },
  el(id){ return document.getElementById(id); },
  toast(msg){ const t=this.el('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(this._tt); this._tt=setTimeout(()=>t.classList.remove('on'),2600); },
  modal(html){ this.el('modalBox').innerHTML = html; this.el('modal').classList.add('on'); },
  fecharModal(){ this.el('modal').classList.remove('on'); },

  /* ---------------- dados ---------------- */
  escalasDoDia(iso){
    return DB.escalas.filter(e=>e.data===iso).sort((a,b)=>
      (a.inicio||'99') .localeCompare(b.inicio||'99') || a.nome.localeCompare(b.nome));
  },
  trabalhosDoDia(iso){ return this.escalasDoDia(iso).filter(e=>e.situacao==='TRABALHO'); },
  sobreavisoVigente(iso){
    return DB.sobreavisos.find(s=>s.ini<=iso && iso<=s.fim) || null;
  },
  feriadoEm(iso){ return DB.feriados.find(f=>f.data===iso) || null; },
  setoresDoDia(iso){
    const m = new Map();
    this.trabalhosDoDia(iso).forEach(e=>{
      if(!m.has(e.setor)) m.set(e.setor, []);
      m.get(e.setor).push(e);
    });
    return m;
  },
  agruparPorHorario(lista){
    const m = new Map();
    lista.forEach(e=>{
      const k = e.inicio && e.fim ? `${e.inicio}|${e.fim}` : 's/h';
      if(!m.has(k)) m.set(k, {inicio:e.inicio, fim:e.fim, pessoas:[]});
      m.get(k).pessoas.push(e);
    });
    return [...m.values()].sort((a,b)=>String(a.inicio).localeCompare(String(b.inicio)));
  },
  avatar(colab, nome, tam){
    const cls = tam ? 'av '+tam : 'av';
    if(colab && colab.foto) return `<div class="${cls}"><img src="${colab.foto}" alt="${esc(nome)}"></div>`;
    return `<div class="${cls}"><b>${esc(iniciais(nome))}</b></div>`;
  },
  nomeDe(e){ const c = e.colaboradorId ? colaboradorPorId(e.colaboradorId) : null; return c ? (c.exibicao||c.nome) : e.nome; },

  /* ---------------- DASHBOARD ---------------- */
  dashboard(){
    const iso = this.diaSel;
    const trabalhos = this.trabalhosDoDia(iso);
    const setores = this.setoresDoDia(iso);
    const sobre = this.sobreavisoVigente(iso);
    const fer = this.feriadoEm(iso);
    const pend = DB.pendentes.filter(p=>p.incluir).length;
    const comProblema = DB.pendentes.filter(p=>p.incluir && p.problema).length;

    const seg = segDaSemana(hojeISO());
    const sab = addDias(seg,5), dom = addDias(seg,6);
    const fds = [...this.trabalhosDoDia(sab), ...this.trabalhosDoDia(dom)];

    const proximosFer = DB.feriados.filter(f=>f.data>=hojeISO()).sort((a,b)=>a.data.localeCompare(b.data)).slice(0,3);

    const recSemFoto = DB.colaboradores.filter(c=>c.situacao!=='inativo' && !c.foto).length;

    let h = `
    <div class="grid g4" style="margin-bottom:16px">
      ${this.kpi('Escalados hoje', trabalhos.length, isoParaBR(iso)+' · '+nomeDia(iso), 'az')}
      ${this.kpi('Setores em operação', setores.size, [...setores.keys()].map(s=>SETOR_NOME[s]||s).join(' · ')||'nenhum', 'am')}
      ${this.kpi('Sobreaviso Rede', sobre?sobre.tecnicos.length:0, sobre?`${isoParaBR(sobre.ini)} a ${isoParaBR(sobre.fim)}`:'não informado', sobre?'vd':'vm')}
      ${this.kpi('Aguardando conferência', pend, comProblema?`${comProblema} com inconsistência`:'nenhuma inconsistência', pend?'vm':'vd')}
    </div>`;

    if(!DB.escalas.length && !DB.pendentes.length){
      h += `<div class="aviso i"><div><b>Comece por aqui.</b> Cadastre as fotos dos colaboradores e importe a primeira planilha de escala. O informativo é gerado a partir dos dados conferidos.<br><br>
        <button class="btn pri sm" onclick="App.ir('importar')">Importar escala</button>
        <button class="btn sm" onclick="App.ir('colaboradores')">Cadastrar fotos</button>
        <button class="btn sm" onclick="App.carregarDemonstracao()">Carregar demonstração</button></div></div>`;
    }

    /* ---- escala do dia ---- */
    h += `<div class="card"><div class="hd">
      <h3>Escala do dia</h3>
      <div class="acoes">
        <button class="btn sm" onclick="App.mudaDia(-1)">‹ anterior</button>
        <button class="btn sm" onclick="App.mudaDia(0)">hoje</button>
        <button class="btn sm" onclick="App.mudaDia(1)">próximo ›</button>
      </div></div>
      <div class="bd">
        <div class="mini muted" style="margin-bottom:10px">
          ${esc(nomeDia(iso))}, ${isoParaBR(iso)} ${fer?`<span class="bg am">FERIADO · ${esc(fer.nome)}</span>`:''}
        </div>
        ${trabalhos.length ? [...setores.entries()].map(([setor, lista])=>`
          <div class="bloco">
            <div class="bt">${esc(SETOR_NOME[setor]||setor)} — ${esc(nomeDia(iso).toUpperCase())}<span class="dta">${lista.length} escalado(s)</span></div>
            ${this.agruparPorHorario(lista).map(g=>`
              <div class="faixa-h">
                <span class="hr">${g.inicio?`${g.inicio} ÀS ${g.fim}`:'SEM HORÁRIO'}</span>
                <div class="slots">${g.pessoas.map(p=>`<div style="display:flex;align-items:center;gap:8px">
                  ${this.avatar(colaboradorPorId(p.colaboradorId), this.nomeDe(p), 'sm')}
                  <span class="small" style="font-weight:600">${esc(this.nomeDe(p))}</span></div>`).join('')}</div>
              </div>`).join('')}
          </div>`).join('') : `<div class="muted small">Nenhum colaborador escalado nesta data.</div>`}
        ${sobre?`<div class="bloco"><div class="bt">SOBREAVISO REDE<span class="dta">${isoParaBR(sobre.ini)} a ${isoParaBR(sobre.fim)}</span></div>
          <div class="faixa-h"><div class="slots">${sobre.tecnicos.map(t=>{
            const c = acharColaborador(t,'MANUTENCAO');
            return `<div class="pessoa">${this.avatar(c,t)}<div class="nm">${esc(t)}</div></div>`;}).join('')}</div></div></div>`:''}
      </div></div>`;

    /* ---- calendário + ladinho ---- */
    h += `<div class="grid g2">
      <div class="card"><div class="hd"><h3>Calendário</h3>
        <div class="acoes">
          <button class="btn sm" onclick="App.mudaMes(-1)">‹</button>
          <button class="btn sm" onclick="App.mudaMes(0)">mês atual</button>
          <button class="btn sm" onclick="App.mudaMes(1)">›</button>
        </div></div>
        <div class="bd">${this.calendario()}</div></div>

      <div>
        <div class="card"><div class="hd"><h3>Próximo final de semana</h3>
          <div class="acoes"><button class="btn sm" onclick="App.abrirInformativo('${sab}','${dom}')">ver informativo</button></div></div>
          <div class="bd">
            <div class="small muted" style="margin-bottom:8px">${isoParaBR(sab)} (sáb) e ${isoParaBR(dom)} (dom) · ${fds.filter(e=>e.situacao==='TRABALHO').length} escalado(s)</div>
            <div class="list">${[sab,dom].map(d=>{
              const lista = this.trabalhosDoDia(d);
              const g = this.setoresDoDia(d);
              return `<div class="li"><div style="flex:1">
                <div class="nm">${DIAS_CUR[diaSemana(d)]} ${isoParaBR(d).slice(0,5)}</div>
                <div class="mini muted">${g.size?[...g.entries()].map(([s,l])=>`${SETOR_NOME[s].split(' —')[0]}: ${l.length}`).join(' · '):'sem escala'}</div>
              </div><span class="bg ${lista.length?'vd':'cz'}">${lista.length}</span></div>`;
            }).join('')}</div>
          </div></div>

        <div class="card"><div class="hd"><h3>Próximos feriados</h3>
          <div class="acoes"><button class="btn sm" onclick="App.ir('sobreaviso')">gerenciar</button></div></div>
          <div class="bd">${proximosFer.length?`<div class="list">${proximosFer.map(f=>{
            const n = this.trabalhosDoDia(f.data).length;
            return `<div class="li"><div style="flex:1"><div class="nm">${isoParaBR(f.data)}</div>
              <div class="mini muted">${esc(f.nome)}</div></div>
              <span class="bg ${n?'vd':'cz'}">${n?n+' escalado(s)':'sem escala'}</span></div>`;}).join('')}</div>`
            :'<div class="muted small">Nenhum feriado cadastrado.</div>'}
            <div class="hr-sep"></div>
            <div class="mini muted">Sobreaviso não informado não é inventado: se o período não estiver cadastrado, o informativo exibe <b>Sobreaviso não informado</b>.</div>
          </div></div>
      </div>
    </div>`;

    /* ---- raster ---- */
    h += `<div class="grid g2">
      <div class="card"><div class="hd"><h3>Colaboradores por setor</h3></div><div class="bd">
        ${SETORES.filter(s=>s!=='SOBREAVISO').map(s=>{
          const tot = DB.colaboradores.filter(c=>c.setor===s && c.situacao!=='inativo').length;
          const esc = trabalhos.filter(e=>e.setor===s).length;
          return `<div class="li" style="margin-bottom:7px"><div style="flex:1"><div class="nm">${SETOR_NOME[s]}</div>
            <div class="mini muted">${tot} cadastrado(s)</div></div>
            <span class="bg ${esc?'vd':'cz'}">${esc} hoje</span></div>`;}).join('')}
      </div></div>

      <div class="card"><div class="hd"><h3>Alertas</h3></div><div class="bd">
        <div class="list">
          ${pend?`<div class="li"><span class="bg vm">conferência</span><div style="flex:1" class="small">${pend} registro(s) importados aguardando confirmação</div><button class="btn sm" onclick="App.ir('conferencia')">abrir</button></div>`:''}
          ${comProblema?`<div class="li"><span class="bg lr">inconsistência</span><div style="flex:1" class="small">${comProblema} registro(s) com nome, setor ou horário a validar</div><button class="btn sm" onclick="App.ir('conferencia')">corrigir</button></div>`:''}
          ${recSemFoto?`<div class="li"><span class="bg am">foto</span><div style="flex:1" class="small">${recSemFoto} colaborador(es) sem foto cadastrada (usa avatar de iniciais)</div><button class="btn sm" onclick="App.ir('colaboradores')">cadastrar</button></div>`:''}
          ${!sobre?`<div class="li"><span class="bg am">sobreaviso</span><div style="flex:1" class="small">Nenhum sobreaviso cobrindo ${isoParaBR(iso)}</div><button class="btn sm" onclick="App.ir('sobreaviso')">cadastrar</button></div>`:''}
          ${!pend&&!comProblema&&!recSemFoto&&sobre?'<div class="aviso s" style="margin:0">Nenhum alerta aberto.</div>':''}
        </div>
      </div></div>
    </div>`;

    /* ---- importações ---- */
    h += `<div class="card"><div class="hd"><h3>Importações recentes</h3>
      <div class="acoes"><button class="btn sm" onclick="App.ir('importar')">nova importação</button></div></div>
      <div class="bd">${DB.importacoes.length?`<div class="list">${DB.importacoes.slice(0,5).map(i=>`
        <div class="li"><div style="flex:1"><div class="nm">${esc(i.arquivo)}</div>
        <div class="mini muted">${i.data} · ${i.registros} registro(s) · ${esc(i.usuario)}</div></div>
        <span class="bg ${i.status==='confirmada'?'vd':i.status==='descartada'?'cz':'am'}">${esc(i.status)}</span></div>`).join('')}</div>`
        :'<div class="muted small">Nenhuma importação registrada.</div>'}</div></div>`;

    this.el('view-dashboard').innerHTML = h;
  },
  kpi(rot, val, sub, cor){
    return `<div class="kpi ${cor||''}"><div class="rot">${esc(rot)}</div><div class="val">${val}</div><div class="sub">${esc(sub)}</div></div>`;
  },
  mudaDia(n){ this.diaSel = n===0 ? hojeISO() : addDias(this.diaSel, n); this.dashboard(); },
  mudaMes(n){
    const [a,m] = this.mesCal.split('-').map(Number);
    const d = new Date(a, m-1+n, 1);
    this.mesCal = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    this.dashboard();
  },
  calendario(){
    const [ano, mes] = this.mesCal.split('-').map(Number);
    const primeiro = new Date(ano, mes-1, 1);
    const inicio = (primeiro.getDay()+6)%7; // segunda como primeiro
    const ultimo = new Date(ano, mes, 0).getDate();
    let h = `<div class="mini" style="text-align:center;font-weight:800;color:var(--azul);margin-bottom:8px;text-transform:capitalize">${MESES[mes-1]} ${ano}</div>`;
    h += `<div class="cal">${['S','T','Q','Q','S','S','D'].map(d=>`<div class="dh">${d}</div>`).join('')}`;
    for(let i=0;i<inicio;i++) h += '<div class="d vaz"></div>';
    for(let d=1; d<=ultimo; d++){
      const iso = `${ano}-${String(mes).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const n = this.trabalhosDoDia(iso).length;
      const fer = this.feriadoEm(iso) ? 'FER' : '';
      const w = diaSemana(iso);
      h += `<div class="d ${w===0||w===6?'fd':''} ${iso===hojeISO()?'hoje':''} ${iso===this.diaSel?'sel':''}"
        onclick="App.selecionaData('${iso}')">
        <div class="n">${d}</div>${n?`<div class="t">${n}</div>`:''}${fer?`<div class="t" style="color:var(--laranja)">${fer}</div>`:''}</div>`;
    }
    h += '</div>';
    h += `<div class="mini muted" style="margin-top:9px">Número = escalados no dia · FER = feriado cadastrado. Clique para abrir a escala.</div>`;
    return h;
  },
  selecionaData(iso){ this.diaSel = iso; this.dashboard(); },

  /* ---------------- demonstração ---------------- */
  carregarDemonstracao(){
    const sab = addDias(segDaSemana(hojeISO()),5), dom = addDias(sab,1);
    const imp = {id:uid(), arquivo:'DEMONSTRAÇÃO (fictício)', data:agora(), usuario:DB.config.usuario, registros:0, status:'demonstracao'};
    const add = (data, setor, nome, ini, fim) => {
      const c = acharColaborador(nome, setor);
      DB.escalas.push({id:uid(), data, setor, colaboradorId:c?c.id:null, nome, inicio:ini, fim:fim,
        situacao:'TRABALHO', origem:'DEMONSTRAÇÃO', importacaoId:imp.id, publicado:false, criado:agora()});
      imp.registros++;
    };
    add(sab,'CSC','Jhenifer Nunes','08:00','13:00'); add(sab,'CSC','Maycon','08:00','13:00');
    add(sab,'CSC','Adriel','08:00','13:00'); add(sab,'CSC','Kawane','08:00','13:00');
    add(sab,'CSC','Kayke','08:00','13:00'); add(sab,'CSC','Camily','08:00','13:00');
    add(sab,'CSC','Blenda','10:00','16:00'); add(sab,'CSC','Lukas','13:00','18:00');
    add(sab,'VENDAS','Jhennifer','08:00','14:00'); add(sab,'MANUTENCAO','Fillipe','08:00','17:00');
    add(dom,'CSC','José Matheus','08:00','13:00'); add(dom,'CSC','Nathan','08:00','13:00');
    add(dom,'CSC','Kawane','13:00','18:00'); add(dom,'CSC','Kayke','13:00','18:00');
    add(dom,'MANUTENCAO','Yan','08:00','17:00');
    DB.sobreavisos.push({id:uid(), ini:addDias(segDaSemana(hojeISO()),0), fim:addDias(segDaSemana(hojeISO()),6),
      tecnicos:['João Antônio','Fillipe','Yan'], obs:'Demonstração'});
    DB.importacoes.unshift(imp);
    logar('demonstração','carregar','dados fictícios','','', 'dados de teste da interface');
    salvar(); this.dashboard();
    toast('Demonstração carregada. Todos os registros estão marcados como DEMONSTRAÇÃO.');
  },

  /* ---------------- backup ---------------- */
  exportarTudo(){
    const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `backup-escalas-csc-${hojeISO()}.json`;
    a.click();
  }
};
</script>
<script>
/* =========================================================================
   IMPORTAR · CONFERÊNCIA · COLABORADORES
   ========================================================================= */
Object.assign(App, {

  _abas: [],
  _avisos: [],

  /* ================= IMPORTAR ================= */
  importar(){
    const abas = this._abas;
    let h = `<div class="card"><div class="hd"><h3>Importar escala</h3>
      <div class="acoes">
        <button class="btn sm" onclick="App.baixarModelo()">Baixar planilha modelo</button>
        <button class="btn sm" onclick="App.importarBackup()">Restaurar backup JSON</button>
      </div></div>
      <div class="bd">
        <div class="aviso i"><div>Envie Excel (.xlsx, .xls) ou CSV. Pode enviar vários arquivos e o sistema lê todas as abas. Nada é publicado: tudo passa pela conferência.</div></div>
        <div class="drop" id="dropZone" onclick="document.getElementById('fileInp').click()">
          <div style="font-size:15px;margin-bottom:6px">📄 <b>Clique para escolher os arquivos</b> ou arraste aqui</div>
          <div class="mini muted">Excel, CSV · várias abas · vários arquivos</div>
          <input type="file" id="fileInp" accept=".xlsx,.xls,.csv" multiple style="display:none"
            onchange="App.receberArquivos(this.files)">
        </div>
        <div class="campo" style="max-width:320px;margin-top:14px">
          <label class="f">Setor padrão (quando a planilha não informar)</label>
          <select onchange="Importador.setorPadrao=this.value">
            ${SETORES.map(s=>`<option value="${s}" ${s==='CSC'?'selected':''}>${SETOR_NOME[s]}</option>`).join('')}
          </select>
        </div>
        ${abas.length?`
          <div class="hr-sep"></div>
          <div class="small" style="font-weight:700;margin-bottom:8px">${abas.length} aba(s) lida(s)</div>
          <div class="list">${abas.map((a,i)=>`
            <div class="li"><span class="bg az">${esc(a.arquivo)}</span>
              <div style="flex:1"><div class="nm">${esc(a.nome)}</div>
              <div class="mini muted">formato detectado: <b>${esc(a.tipo)}</b></div></div>
              <button class="btn sm dg" onclick="App.removerAba(${i})">remover</button></div>`).join('')}</div>
          <div style="margin-top:14px">
            <button class="btn pri" onclick="App.processarImportacao()">Processar e conferir →</button>
            <button class="btn" onclick="App._abas=[];App.importar()">limpar</button>
          </div>`:''}
        ${this._avisos.length?`<div class="aviso w" style="margin-top:14px"><div>
          <b>Pontos que precisam de atenção:</b><ul style="margin:6px 0 0 16px;padding:0">
          ${this._avisos.slice(0,12).map(a=>`<li>${esc(a)}</li>`).join('')}
          ${this._avisos.length>12?`<li>… e mais ${this._avisos.length-12}</li>`:''}</ul></div></div>`:''}
      </div></div>

      <div class="card"><div class="hd"><h3>Formatos reconhecidos</h3></div><div class="bd">
        <div class="grid g2">
          <div>
            <div class="small" style="font-weight:700;margin-bottom:6px">Horários aceitos</div>
            <div class="mini muted">08h-13h · 08:00/13:00 · 08H ÀS 13H · 18h-00h · 12-16 · 18h30-23h30<br>
            Todos convertidos para HH:MM a HH:MM (24h).</div>
            <div class="small" style="font-weight:700;margin:12px 0 6px">Situações</div>
            <div class="mini muted">FOLGA, FÉRIAS, ATESTADO e FOLGA FERIADO não geram turno: ficam registradas como situação.
            SIM e NÃO indicam expediente e nunca são lidos como nome.</div>
          </div>
          <div>
            <div class="small" style="font-weight:700;margin-bottom:6px">Vários nomes na mesma célula</div>
            <div class="mini muted">Separados por vírgula, ponto e vírgula, barra ou “ e ”. O mesmo horário é aplicado a todos.</div>
            <div class="small" style="font-weight:700;margin:12px 0 6px">Estruturas</div>
            <div class="mini muted">Colaboradores nas linhas e datas nas colunas · dias nas linhas · uma linha por horário
            (data, setor, início, fim, colaboradores) · abas de sobreaviso e de cadastro.</div>
          </div>
        </div>
        <div class="aviso w" style="margin:14px 0 0"><div><b>Regra obrigatória:</b> o sistema não inventa colaborador, horário ou setor.
        Nome fora do cadastro entra como pendência para você decidir.</div></div>
      </div></div>`;
    this.el('view-importar').innerHTML = h;
    const dz = this.el('dropZone');
    if(dz){
      dz.ondragover = e=>{ e.preventDefault(); dz.classList.add('over'); };
      dz.ondragleave = ()=> dz.classList.remove('over');
      dz.ondrop = e=>{ e.preventDefault(); dz.classList.remove('over'); this.receberArquivos(e.dataTransfer.files); };
    }
  },

  async receberArquivos(files){
    if(!files || !files.length) return;
    this._avisos = [];
    for(const f of files){
      try{
        const abas = await Importador.lerArquivo(f);
        abas.forEach(a=>{
          const tipo = Importador.detectar(a);
          this._abas.push({arquivo:f.name, nome:a.nome, matriz:a.matriz, tipo});
        });
      }catch(err){
        this._avisos.push(`Não foi possível ler "${f.name}": ${err.message}`);
      }
    }
    this.importar();
    toast(`${this._abas.length} aba(s) prontas para processar.`);
  },
  removerAba(i){ this._abas.splice(i,1); this.importar(); },

  processarImportacao(){
    if(!this._abas.length) return toast('Nenhuma aba carregada.');
    const res = Importador.processar(this._abas);
    if(!res.registros.length && !res.cadastros.length){
      return toast('Nenhum registro reconhecido. Verifique a estrutura da planilha.');
    }
    const imp = {id:uid(), arquivo:this._abas.map(a=>a.arquivo).filter((v,i,arr)=>arr.indexOf(v)===i).join(', '),
      data:agora(), usuario:DB.config.usuario, registros:res.registros.length, status:'aguardando conferência'};
    DB.importacoes.unshift(imp);

    /* cadastros novos vindos da aba COLABORADORES */
    let novos = 0;
    res.cadastros.forEach(p=>{
      if(!acharColaborador(p.nome, p.setor)){
        DB.colaboradores.push({id:uid(), codigo:p.codigo||'', nome:p.nome, exibicao:p.exibicao,
          setor:p.setor, jornada:p.jornada||'', foto:'', situacao:p.situacao||'ativo',
          apelidos:p.apelidos||[], criado:agora(), origem:'IMPORTADO'});
        novos++;
      }
    });
    res.sobreavisos.forEach(s=>{
      if(!DB.sobreavisos.some(x=>x.ini===s.ini && x.fim===s.fim)){
        DB.sobreavisos.push({id:uid(), ini:s.ini, fim:s.fim, tecnicos:s.tecnicos, obs:s.obs||''});
      }
    });

    DB.pendentes = DB.pendentes.concat(res.registros);
    this._avisos = res.avisos;
    logar('importação','processar', imp.arquivo, '', `${res.registros.length} registros`, '');
    salvar();
    this._abas = [];
    toast(`Lidos ${res.registros.length} registros${novos?` e ${novos} colaborador(es) novo(s)`:''}.`);
    this.ir('conferencia');
  },

  baixarModelo(){
    const wb = XLSX.utils.book_new();
    const d0 = segDaSemana(hojeISO());
    const cab = ['colaborador','setor'];
    for(let i=0;i<7;i++) cab.push(isoParaBR(addDias(d0,i)));
    const aoa = [cab];
    DB.colaboradores.filter(c=>c.setor==='CSC' && c.situacao!=='inativo').forEach(c=>{
      const l = [c.nome,'CSC'];
      for(let i=0;i<7;i++) l.push('');
      aoa.push(l);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), 'ESCALA_SEMANA');

    const sab = addDias(d0,5), dom = addDias(d0,6);
    const fds = [['data','setor','horario_inicio','horario_fim','colaboradores','situacao'],
      [isoParaBR(sab),'CSC','08:00','13:00','Nome 1, Nome 2','TRABALHO'],
      [isoParaBR(sab),'CSC','13:00','18:00','Nome 3','TRABALHO'],
      [isoParaBR(dom),'CSC','08:00','13:00','Nome 4','TRABALHO'],
      [isoParaBR(dom),'CSC','','','','FOLGA']];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(fds), 'FINAL_DE_SEMANA');

    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
      ['data','feriado','setor','horario_inicio','horario_fim','colaboradores','situacao'],
      ['20/11/2026','DIA DA CONSCIÊNCIA NEGRA','CSC','08:00','13:00','Nome 1','TRABALHO'],
      ['20/11/2026','DIA DA CONSCIÊNCIA NEGRA','QUALIDADE','','','','FOLGA_FERIADO']
    ]), 'FERIADOS');

    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
      ['data_inicial','data_final','tecnicos','observacoes'],
      [isoParaBR(d0), isoParaBR(addDias(d0,6)), 'Técnico 1 / Técnico 2', 'Semana de referência']
    ]), 'SOBREAVISO');

    const cad = [['codigo','nome_completo','nome_exibicao','setor','situacao','apelidos','jornada']];
    DB.colaboradores.forEach(c=>cad.push([c.codigo,c.nome,c.exibicao,c.setor,c.situacao,(c.apelidos||[]).join('; '),c.jornada||'']));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(cad), 'COLABORADORES');

    XLSX.writeFile(wb, 'modelo-escala-csc.xlsx');
    toast('Planilha modelo baixada.');
  },

  importarBackup(){
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json';
    inp.onchange = ()=>{
      const f = inp.files[0]; if(!f) return;
      const fr = new FileReader();
      fr.onload = ()=>{
        try{
          const d = JSON.parse(fr.result);
          if(!d.colaboradores || !d.escalas) throw new Error('arquivo inválido');
          DB = Object.assign(dbVazio(), d);
          salvar(); toast('Backup restaurado.'); this.ir('dashboard');
        }catch(e){ toast('Backup inválido: '+e.message); }
      };
      fr.readAsText(f);
    };
    inp.click();
  },

  /* ================= CONFERÊNCIA ================= */
  confFiltro: 'todos',
  confBusca: '',

  conferencia(){
    const pend = DB.pendentes;
    const edit = this.editandoConf;
    const comProblema = pend.filter(p=>p.problema).length;
    const incluir = pend.filter(p=>p.incluir).length;

    let lista = pend.slice();
    if(this.confFiltro==='problema') lista = lista.filter(p=>p.problema);
    if(this.confBusca){ const q = norm(this.confBusca); lista = lista.filter(p=>norm(p.nome).includes(q)); }
    lista.sort((a,b)=> a.data.localeCompare(b.data) || String(a.inicio).localeCompare(String(b.inicio)));

    let h = `<div class="card"><div class="hd"><h3>Conferência antes da publicação</h3>
      <div class="acoes">
        <button class="btn ${edit?'am':''}" onclick="App.editarConf()">${edit?'✓ edição ativa':'CORRIGIR DADOS'}</button>
        <button class="btn pri" onclick="App.confirmarImportacao()">CONFIRMAR IMPORTAÇÃO</button>
        <button class="btn" onclick="App.publicarDireto()">PUBLICAR INFORMATIVO</button>
        <button class="btn dg" onclick="App.descartarPendentes()">descartar</button>
      </div></div>
      <div class="bd">
        ${pend.length?`
        <div class="grid g4" style="margin-bottom:14px">
          ${this.kpi('Registros lidos', pend.length, 'no lote atual','az')}
          ${this.kpi('Marcados para entrar', incluir, 'serão gravados na escala','vd')}
          ${this.kpi('Com inconsistência', comProblema, 'nome, setor ou horário','vm')}
          ${this.kpi('Dias cobertos', new Set(pend.map(p=>p.data)).size, 'datas distintas','am')}
        </div>
        <div class="sel" style="margin-bottom:12px">
          <div class="campo" style="max-width:190px"><label class="f">Filtro</label>
            <select onchange="App.confFiltro=this.value;App.conferencia()">
              <option value="todos" ${this.confFiltro==='todos'?'selected':''}>Todos</option>
              <option value="problema" ${this.confFiltro==='problema'?'selected':''}>Somente com problema</option>
            </select></div>
          <div class="campo" style="max-width:230px"><label class="f">Buscar colaborador</label>
            <input type="text" value="${esc(this.confBusca)}" oninput="App.confBusca=this.value;App.conferencia()"></div>
        </div>
        ${edit?'<div class="aviso w"><div>Edição ativa: altere data, setor, nome, horário ou situação. Cada alteração fica registrada no histórico.</div></div>':''}
        <div class="tbl-scroll"><table>
          <thead><tr>
            <th style="width:38px">In</th><th>Data</th><th>Setor</th><th>Colaborador</th>
            <th>Início</th><th>Fim</th><th>Situação</th><th>Validação</th><th></th>
          </tr></thead><tbody>
          ${lista.map(p=>{
            const i = pend.indexOf(p);
            const c = p.colaboradorId ? colaboradorPorId(p.colaboradorId) : null;
            const bg = p.problema ? 'vm' : p.duplicado ? 'am' : 'vd';
            const txt = p.problema || 'ok';
            return `<tr>
              <td><input type="checkbox" ${p.incluir?'checked':''} onchange="App.confSet(${i},'incluir',this.checked)"></td>
              <td>${edit?`<input type="date" value="${p.data}" onchange="App.confSet(${i},'data',this.value)">`:isoParaBR(p.data)}</td>
              <td>${edit?`<select onchange="App.confSet(${i},'setor',this.value)">${SETORES.map(s=>`<option value="${s}" ${p.setor===s?'selected':''}>${esc(SETOR_NOME[s])}</option>`).join('')}</select>`:esc(SETOR_NOME[p.setor]||p.setor)}</td>
              <td>${edit?`<input type="text" value="${esc(p.nome)}" onchange="App.confSet(${i},'nome',this.value)">`:esc(p.nome)}
                  ${!c&&!edit?` <button class="btn sm" onclick="App.novoColaborador('${esc(p.nome)}','${p.setor}')">cadastrar</button>`:''}</td>
              <td>${edit?`<input type="time" value="${p.inicio}" onchange="App.confSet(${i},'inicio',this.value)">`:(p.inicio||'—')}</td>
              <td>${edit?`<input type="time" value="${p.fim}" onchange="App.confSet(${i},'fim',this.value)">`:(p.fim||'—')}</td>
              <td>${edit?`<select onchange="App.confSet(${i},'situacao',this.value)">${SITUACOES.map(s=>`<option value="${s}" ${p.situacao===s?'selected':''}>${SIT_NOME[s]}</option>`).join('')}</select>`:`<span class="bg ${p.situacao==='TRABALHO'?'az':'cz'}">${SIT_NOME[p.situacao]}</span>`}</td>
              <td><span class="bg ${bg}">${esc(txt)}</span></td>
              <td><button class="btn sm dg" onclick="App.confRemover(${i})">×</button></td>
            </tr>`;
          }).join('')}
          </tbody></table></div>
        <div class="mini muted" style="margin-top:10px">${lista.length} linha(s) exibida(s) · ${DB.pendentes.length} no lote</div>`
        :`<div class="aviso s"><div>Nenhum registro pendente. Importe uma planilha para começar a conferência.</div></div>
          <button class="btn pri" onclick="App.ir('importar')">Importar escala</button>`}
      </div></div>`;
    this.el('view-conferencia').innerHTML = h;
    this.atualizaBadge();
  },
  editarConf(){ this.editandoConf = !this.editandoConf; this.conferencia(); },
  confSet(i, campo, valor){
    const p = DB.pendentes[i]; if(!p) return;
    const antes = p[campo];
    p[campo] = valor;
    if(campo==='nome'){
      const c = acharColaborador(valor, p.setor);
      p.colaboradorId = c ? c.id : null;
      p.problema = c ? '' : 'Colaborador não cadastrado';
    }
    if(campo==='setor' || campo==='inicio' || campo==='fim'){
      if(campo==='inicio'||campo==='fim'){ if(p.inicio && p.fim && p.situacao==='TRABALHO') p.problema = p.colaboradorId?'':'Colaborador não cadastrado'; }
      if(campo==='setor'){
        const c = p.colaboradorId?colaboradorPorId(p.colaboradorId):null;
        if(c && c.setor!==valor) p.problema = `Setor difere do cadastro (${SETOR_NOME[c.setor]})`;
        else if(!c) p.problema = 'Colaborador não cadastrado';
        else p.problema = '';
      }
    }
    if(campo==='situacao' && valor!=='TRABALHO') p.problema = p.colaboradorId?'':'Colaborador não cadastrado';
    logar('conferência','corrigir', p.nome, `${campo}: ${antes}`, `${campo}: ${valor}`, '');
    salvar(); this.conferencia();
  },
  confRemover(i){ const p = DB.pendentes.splice(i,1)[0]; logar('conferência','remover', p?p.nome:'','','',''); salvar(); this.conferencia(); },

  confirmarImportacao(){
    const validos = DB.pendentes.filter(p=>p.incluir);
    if(!validos.length) return toast('Nenhum registro marcado para confirmar.');
    const impId = DB.importacoes[0] ? DB.importacoes[0].id : uid();
    let gravados = 0, atualizados = 0;
    validos.forEach(p=>{
      const chave = e => e.data===p.data && (e.colaboradorId||norm(e.nome)) === (p.colaboradorId||norm(p.nome)) && e.inicio===p.inicio && e.fim===p.fim && e.situacao===p.situacao;
      if(DB.escalas.some(chave)) return;
      DB.escalas.push({id:uid(), data:p.data, setor:p.setor, colaboradorId:p.colaboradorId, nome:p.nome,
        inicio:p.inicio, fim:p.fim, situacao:p.situacao, origem:'IMPORTADO', importacaoId:impId,
        publicado:false, criado:agora()});
      gravados++;
    });
    const restantes = DB.pendentes.filter(p=>!p.incluir);
    if(DB.importacoes[0]) DB.importacoes[0].status = 'confirmada';
    DB.pendentes = restantes;
    logar('importação','confirmar', impId, '', `${gravados} registros gravados`, '');
    salvar();
    toast(`${gravados} registro(s) gravados na escala${atualizados?`, ${atualizados} atualizados`:''}.`);
    this.ir('dashboard');
  },
  descartarPendentes(){
    if(!DB.pendentes.length) return;
    if(!confirm('Descartar todos os registros pendentes deste lote?')) return;
    logar('importação','descartar','lote pendente', `${DB.pendentes.length} registros`, '0', '');
    DB.pendentes = [];
    salvar(); this.conferencia(); toast('Lote descartado.');
  },
  publicarDireto(){
    if(DB.pendentes.filter(p=>p.incluir).length){
      this.confirmarImportacao();
    }
    this.ir('informativo');
  },

  /* ================= COLABORADORES ================= */
  colabBusca: '',
  colaboradores(){
    const q = norm(this.colabBusca);
    const lista = DB.colaboradores
      .filter(c=>!q || norm(c.nome).includes(q) || norm(c.codigo).includes(q) || (c.apelidos||[]).some(a=>norm(a).includes(q)))
      .sort((a,b)=> (a.setor||'').localeCompare(b.setor||'') || a.nome.localeCompare(b.nome));
    const semFoto = DB.colaboradores.filter(c=>c.situacao!=='inativo' && !c.foto).length;

    let h = `<div class="card"><div class="hd"><h3>Colaboradores</h3>
      <div class="acoes">
        <input type="text" placeholder="buscar nome, código ou apelido" style="width:230px"
          value="${esc(this.colabBusca)}" oninput="App.colabBusca=this.value;App.colaboradores()">
        <button class="btn pri" onclick="App.novoColaborador()">+ Novo colaborador</button>
      </div></div>
      <div class="bd">
        <div class="grid g4" style="margin-bottom:14px">
          ${this.kpi('Cadastrados', DB.colaboradores.length, 'no total','az')}
          ${this.kpi('Ativos', DB.colaboradores.filter(c=>c.situacao!=='inativo').length, 'disponíveis para escala','vd')}
          ${this.kpi('Sem foto', semFoto, 'usam avatar de iniciais', semFoto?'am':'vd')}
          ${this.kpi('Setores', new Set(DB.colaboradores.map(c=>c.setor)).size, 'com equipe cadastrada','az')}
        </div>
        ${semFoto?`<div class="aviso w"><div>${semFoto} colaborador(es) sem foto. A foto é enviada uma única vez e passa a ser usada automaticamente em todas as escalas.</div></div>`:''}
        <div class="grid g3">
        ${lista.map(c=>{
          const nEsc = DB.escalas.filter(e=>e.colaboradorId===c.id || norm(e.nome)===norm(c.nome)).length;
          return `<div class="li" style="align-items:flex-start">
            ${this.avatar(c, c.nome, 'lg')}
            <div style="flex:1;min-width:0">
              <div class="nm">${esc(c.exibicao||c.nome)}</div>
              <div class="mini muted">${esc(c.nome)}</div>
              <div class="mini" style="margin-top:5px">
                <span class="bg az">${esc(SETOR_NOME[c.setor]||c.setor)}</span>
                ${c.codigo?`<span class="bg cz">${esc(c.codigo)}</span>`:''}
                <span class="bg ${c.situacao==='inativo'?'cz':'vd'}">${c.situacao==='inativo'?'inativo':'ativo'}</span>
              </div>
              <div class="mini muted" style="margin-top:5px">${c.jornada?esc(c.jornada)+' · ':''}${nEsc} escala(s)${(c.apelidos||[]).length?' · apelidos: '+esc(c.apelidos.join(', ')):''}</div>
              <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
                <button class="btn sm" onclick="App.editarColaborador('${c.id}')">editar</button>
                <button class="btn sm" onclick="App.fotoRapida('${c.id}')">foto</button>
                <button class="btn sm" onclick="App.historicoColaborador('${c.id}')">escalas</button>
              </div>
            </div></div>`;
        }).join('') || '<div class="muted small">Nenhum colaborador encontrado.</div>'}
        </div>
        <div class="aviso i" style="margin:16px 0 0"><div><b>Nomes parecidos não são a mesma pessoa.</b>
        O reconhecimento é feito apenas por nome exato, código ou apelido cadastrado.
        JHENIFER NUNES (CSC) e JHENNIFER (Vendas) são cadastros distintos.</div></div>
      </div></div>`;
    this.el('view-colaboradores').innerHTML = h;
  },

  novoColaborador(nome, setor){
    const c = {id:'', nome:nome||'', exibicao:nome||'', codigo:'', setor:setor||'CSC', jornada:'',
      foto:'', situacao:'ativo', apelidos:[]};
    this.formColaborador(c, true);
  },
  editarColaborador(id){
    const c = colaboradorPorId(id); if(!c) return;
    this.formColaborador(JSON.parse(JSON.stringify(c)), false);
  },
  formColaborador(c, novo){
    this.modal(`
      <h3>${novo?'Novo colaborador':'Editar colaborador'}</h3>
      <div class="grid g2">
        <div class="campo"><label class="f">Nome completo</label>
          <input type="text" id="fNome" value="${esc(c.nome)}"></div>
        <div class="campo"><label class="f">Nome de exibição</label>
          <input type="text" id="fExib" value="${esc(c.exibicao)}"></div>
        <div class="campo"><label class="f">Código / matrícula</label>
          <input type="text" id="fCod" value="${esc(c.codigo)}"></div>
        <div class="campo"><label class="f">Setor</label>
          <select id="fSetor">${SETORES.map(s=>`<option value="${s}" ${c.setor===s?'selected':''}>${esc(SETOR_NOME[s])}</option>`).join('')}</select></div>
        <div class="campo"><label class="f">Jornada padrão</label>
          <input type="text" id="fJor" value="${esc(c.jornada||'')}" placeholder="08h-18h"></div>
        <div class="campo"><label class="f">Situação</label>
          <select id="fSit"><option value="ativo" ${c.situacao!=='inativo'?'selected':''}>Ativo</option>
          <option value="inativo" ${c.situacao==='inativo'?'selected':''}>Inativo</option></select></div>
      </div>
      <div class="campo"><label class="f">Apelidos e variações de grafia (separe por ;)</label>
        <input type="text" id="fApel" value="${esc((c.apelidos||[]).join('; '))}" placeholder="Jhenifer N.; J. Nunes"></div>
      <div class="campo"><label class="f">Foto de perfil</label>
        <div style="display:flex;gap:14px;align-items:center">
          <div id="previewFoto">${c.foto?`<div class="av lg"><img src="${c.foto}"></div>`:`<div class="av lg"><b>${esc(iniciais(c.nome))}</b></div>`}</div>
          <div style="flex:1">
            <input type="file" id="fFoto" accept="image/*" onchange="App.trocarFoto(this)">
            <div class="mini muted" style="margin-top:6px">Enquadrada em círculo, 260x260. Envie uma vez: será usada em todas as escalas.</div>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
        <button class="btn" onclick="App.fecharModal()">cancelar</button>
        <button class="btn pri" onclick="App.salvarColaborador('${c.id}')">salvar</button>
      </div>`);
    this._fotoTemp = c.foto || '';
  },
  async trocarFoto(inp){
    const f = inp.files[0]; if(!f) return;
    const dataUrl = await this.recortarFoto(f);
    this._fotoTemp = dataUrl;
    this.el('previewFoto').innerHTML = `<div class="av lg"><img src="${dataUrl}"></div>`;
  },
  recortarFoto(file){
    return new Promise(res=>{
      const fr = new FileReader();
      fr.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{
          const s = Math.min(img.width, img.height);
          const cv = document.createElement('canvas');
          cv.width = cv.height = 260;
          const ctx = cv.getContext('2d');
          const sx = (img.width - s)/2;
          const sy = Math.max(0, (img.height - s)/2 - s*0.06);
          ctx.drawImage(img, sx, sy, s, s, 0, 0, 260, 260);
          res(cv.toDataURL('image/jpeg', 0.82));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  },
  fotoRapida(id){
    const c = colaboradorPorId(id); if(!c) return;
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = async ()=>{
      const f = inp.files[0]; if(!f) return;
      const antes = c.foto ? 'com foto' : 'sem foto';
      c.foto = await this.recortarFoto(f);
      logar('colaborador','foto', c.nome, antes, 'com foto', '');
      salvar(); this.colaboradores(); toast('Foto atualizada.');
    };
    inp.click();
  },
  salvarColaborador(id){
    const nome = this.el('fNome').value.trim();
    if(!nome) return toast('Informe o nome completo.');
    const dados = {
      nome, exibicao: this.el('fExib').value.trim() || nome,
      codigo: this.el('fCod').value.trim(),
      setor: this.el('fSetor').value,
      jornada: this.el('fJor').value.trim(),
      situacao: this.el('fSit').value,
      apelidos: this.el('fApel').value.split(/[;,]/).map(s=>s.trim()).filter(Boolean),
      foto: this._fotoTemp || ''
    };
    if(id){
      const c = colaboradorPorId(id);
      logar('colaborador','editar', nome, c.nome, dados.nome, '');
      Object.assign(c, dados);
    }else{
      const dup = DB.colaboradores.find(x=>norm(x.nome)===norm(nome) && x.setor===dados.setor);
      if(dup) return toast('Já existe colaborador com esse nome neste setor.');
      DB.colaboradores.push(Object.assign({id:uid(), criado:agora(), origem:'MANUAL'}, dados));
      logar('colaborador','criar', nome, '', dados.setor, '');
    }
    salvar(); this.fecharModal(); this.colaboradores(); toast('Colaborador salvo.');
  },
  historicoColaborador(id){
    const c = colaboradorPorId(id); if(!c) return;
    const listaEsc = DB.escalas.filter(e=>e.colaboradorId===id || norm(e.nome)===norm(c.nome))
      .sort((a,b)=>b.data.localeCompare(a.data));
    this.modal(`<h3>Escalas de ${esc(c.exibicao||c.nome)}</h3>
      <div class="mini muted" style="margin-bottom:12px">${esc(SETOR_NOME[c.setor]||c.setor)} · ${esc(c.codigo||'sem código')}</div>
      
      ${listaEsc.length?`<div class="tbl-scroll"><table><thead><tr><th>Data</th><th>Dia</th><th>Horário</th><th>Situação</th><th>Origem</th></tr></thead>
      <tbody>${listaEsc.map(e=>`<tr><td>${isoParaBR(e.data)}</td><td>${DIAS_CUR[diaSemana(e.data)]}</td>
        <td>${e.inicio?e.inicio+' - '+e.fim:'—'}</td><td>${SIT_NOME[e.situacao]||e.situacao}</td>
        <td class="mini muted">${esc(e.origem||'')}</td></tr>`).join('')}</tbody></table></div>`
      :'<div class="muted small">Nenhuma escala registrada para este colaborador.</div>'}
      <div style="text-align:right;margin-top:14px"><button class="btn" onclick="App.fecharModal()">fechar</button></div>`);
  }
});
</script>
<style>
#printArea{display:none}
@media print{ #printArea{display:block!important} }
</style>
<script>
/* =========================================================================
   INFORMATIVO · PUBLICAÇÃO · SOBREAVISO · FERIADOS · HISTÓRICO
   ========================================================================= */
Object.assign(App, {

  infTipo: 'fds',
  infData: null,
  infSetores: null,

  /* ---------------- seleção ---------------- */
  informativo(){
    if(!this.infData){
      const seg = segDaSemana(hojeISO());
      this.infData = diaSemana(hojeISO())===0 ? addDias(hojeISO(),-1) : addDias(seg,5);
    }
    const datas = this.datasDoInformativo();
    const todos = SETORES;
    if(!this.infSetores) this.infSetores = todos.slice();
    const snap = this.montarSnapshot(datas);
    const previa = this.renderSnapshot(snap);

    let h = `<div class="card no-print"><div class="hd"><h3>Gerador de informativo</h3>
      <div class="acoes">
        <button class="btn pri" onclick="App.publicar()">PUBLICAR INFORMATIVO</button>
      </div></div>
      <div class="bd">
        <div class="sel">
          <div class="campo" style="max-width:230px"><label class="f">Tipo</label>
            <select onchange="App.infTipo=this.value;App.informativo()">
              <option value="fds" ${this.infTipo==='fds'?'selected':''}>Final de semana</option>
              <option value="dia" ${this.infTipo==='dia'?'selected':''}>Dia específico</option>
              <option value="feriado" ${this.infTipo==='feriado'?'selected':''}>Feriado</option>
            </select></div>
          <div class="campo" style="max-width:200px"><label class="f">${this.infTipo==='fds'?'Sábado de referência':'Data'}</label>
            <input type="date" value="${this.infTipo==='fds'?this.infData:this.infData}" onchange="App.infData=this.value;App.informativo()"></div>
          <div class="campo" style="max-width:170px"><label class="f">Ajustes</label>
            <div style="display:flex;gap:6px">
              <button class="btn sm" onclick="App.infData=App.add(  App.infTipo==='fds'?-7:-1);App.informativo()">‹</button>
              <button class="btn sm" onclick="App.infData=App.hoje();App.informativo()">atual</button>
              <button class="btn sm" onclick="App.infData=App.add(App.infTipo==='fds'?7:1);App.informativo()">›</button>
            </div></div>
        </div>
        <div class="hr-sep"></div>
        <label class="f">Setores exibidos</label>
        <div style="display:flex;gap:14px;flex-wrap:wrap">
          ${todos.map(s=>`<label class="small" style="display:flex;gap:6px;align-items:center;cursor:pointer">
            <input type="checkbox" ${this.infSetores.includes(s)?'checked':''} onchange="App.toggleSetor('${s}',this.checked)">
            ${esc(SETOR_NOME[s])}</label>`).join('')}
        </div>
        <div class="aviso i" style="margin:14px 0 0"><div>Setores sem expediente na data <b>não geram quadro</b>.
        Sobreaviso de Rede é puxado automaticamente do período semanal que cobre a data; se não existir, aparece “Sobreaviso não informado”.</div></div>
      </div></div>

      <div class="card no-print"><div class="hd"><h3>Ações</h3></div><div class="bd" style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="App.imprimir()">Imprimir / PDF (A4)</button>
        <button class="btn" onclick="App.copiarLink()">Copiar link de compartilhamento</button>
        <button class="btn" onclick="App.enviarWhats()">Compartilhar no WhatsApp</button>
        <button class="btn" onclick="App.baixarInformativo()">Baixar informativo (HTML)</button>
      </div></div>

      <div class="small muted no-print" style="margin-bottom:8px;font-weight:700">Pré-visualização</div>
      <div id="previaInformativo">${previa}</div>`;

    this.el('view-informativo').innerHTML = h;
    this._snap = snap;
  },
  add(n){ return addDias(this.infData, n); },
  hoje(){ return hojeISO(); },
  toggleSetor(s, on){
    if(on){ if(!this.infSetores.includes(s)) this.infSetores.push(s); }
    else this.infSetores = this.infSetores.filter(x=>x!==s);
    this.informativo();
  },
  datasDoInformativo(){
    if(this.infTipo==='fds'){
      const sab = diaSemana(this.infData)===0 ? addDias(this.infData,-1) : this.infData;
      return [sab, addDias(sab,1)];
    }
    return [this.infData];
  },
  abrirInformativo(a, b){
    this.infTipo='fds'; this.infData = a; this.ir('informativo');
  },

  /* ---------------- montar dados do informativo ---------------- */
  montarSnapshot(datas){
    const bloqueios = [];
    const blocos = [];
    let sobre = null, feriado = null;

    datas.forEach((data, idx)=>{
      const fer = this.feriadoEm(data);
      if(fer) feriado = fer;
      const trabalhos = this.trabalhosDoDia(data).filter(e=>this.infSetores.includes(e.setor));
      const porSetor = new Map();
      trabalhos.forEach(e=>{
        if(!porSetor.has(e.setor)) porSetor.set(e.setor, []);
        porSetor.get(e.setor).push(e);
      });
      SETORES.filter(s=>s!=='SOBREAVISO').forEach(setor=>{
        const lista = porSetor.get(setor);
        if(!lista || !lista.length) return;
        blocos.push({
          data, setor,
          horarios: this.agruparPorHorario(lista).map(g=>({
            inicio: g.inicio, fim: g.fim,
            pessoas: g.pessoas.map(p=>{
              const c = p.colaboradorId ? colaboradorPorId(p.colaboradorId) : null;
              return {nome: this.nomeDe(p), iniciais: iniciais(this.nomeDe(p)), foto: c?c.foto:''};
            })
          }))
        });
      });
      if(!sobre && this.infSetores.includes('SOBREAVISO')){
        const s = this.sobreavisoVigente(data);
        if(s) sobre = {ini:s.ini, fim:s.fim, tecnicos:s.tecnicos.map(t=>{
          const c = acharColaborador(t,'MANUTENCAO');
          return {nome:t, iniciais:iniciais(t), foto:c?c.foto:''};
        })};
      }
      /* ausências registradas nas datas */
      DB.ausencias.filter(a=>a.data===data).forEach(a=>bloqueios.push({data, nome:a.nome, tipo:a.tipo, motivo:a.motivo}));
    });

    let titulo;
    if(this.infTipo==='fds'){
      const a = isoParaBR(datas[0]).slice(0,5);
      const b = isoParaBR(datas[1]).slice(0,5);
      titulo = `ESCALA DO FINAL DE SEMANA — ${a} E ${b}`;
    } else if(this.infTipo==='feriado'){
      titulo = `FERIADO — ${isoParaBR(datas[0])}${feriado?' — '+String(feriado.nome).toUpperCase():''}`;
    } else {
      titulo = `ESCALA DO DIA — ${isoParaBR(datas[0])}`;
    }
    return {titulo, datas, blocos, sobre, feriado: feriado?feriado.nome:null, gerado:agora()};
  },

  /* ---------------- render ---------------- */
  renderSnapshot(snap){
    const dias = snap.datas;
    let h = `<div class="infor">
      <div class="capa">
        <div class="sub">Arroba Banda Larga · Comunicação interna</div>
        <h2>${esc(snap.titulo)}</h2>
        <div class="faixa"></div>
      </div>
      <div class="corpo">`;

    /* sobreaviso */
    h += `<div class="bloco"><div class="bt">ESCALA SOBREAVISO REDE
      ${snap.sobre?`<span class="dta">${isoParaBR(snap.sobre.ini)} A ${isoParaBR(snap.sobre.fim)}</span>`:''}</div>`;
    if(snap.sobre && snap.sobre.tecnicos.length){
      h += `<div class="faixa-h"><div class="slots">${snap.sobre.tecnicos.map(t=>`
        <div class="pessoa">${t.foto?`<div class="av"><img src="${t.foto}" alt=""></div>`:`<div class="av"><b>${esc(t.iniciais)}</b></div>`}
        <div class="nm">${esc(t.nome)}</div></div>`).join('')}</div></div>`;
    }else{
      h += `<div class="vazio">Sobreaviso não informado para o período.</div>`;
    }
    h += `</div>`;

    /* por dia / setor */
    dias.forEach(data=>{
      const doDia = snap.blocos.filter(b=>b.data===data);
      const setoresNoDia = [...new Set(doDia.map(b=>b.setor))];
      if(!doDia.length){
        h += `<div class="bloco"><div class="bt">${esc(nomeDia(data).toUpperCase())} — ${isoParaBR(data)}
          <span class="dta">SEM EXPEDIENTE</span></div><div class="vazio">Nenhum setor com expediente nesta data.</div></div>`;
        return;
      }
      SETORES.filter(s=>s!=='SOBREAVISO' && setoresNoDia.includes(s)).forEach(setor=>{
        const b = doDia.find(x=>x.setor===setor);
        h += `<div class="bloco"><div class="bt">${esc(SETOR_NOME[setor].toUpperCase())} — ${esc(nomeDia(data).toUpperCase())}
          <span class="dta">${isoParaBR(data)}</span></div>`;
        b.horarios.forEach(g=>{
          h += `<div class="faixa-h">
            <span class="hr">${g.inicio?`${g.inicio} ÀS ${g.fim}`:'HORÁRIO NÃO INFORMADO'}</span>
            <div class="slots">${g.pessoas.map(p=>`
              <div class="pessoa">${p.foto?`<div class="av"><img src="${p.foto}" alt=""></div>`:`<div class="av"><b>${esc(p.iniciais)}</b></div>`}
              <div class="nm">${esc(p.nome)}</div></div>`).join('')}</div>
          </div>`;
        });
        h += `</div>`;
      });
    });

    h += `<div class="mini muted" style="text-align:center;margin-top:10px">
      Gerado em ${esc(snap.gerado)} · Painel de Escalas CSC — Arroba Banda Larga</div>`;
    h += `</div></div>`;
    return h;
  },

  /* ---------------- imprimir / pdf ---------------- */
  imprimir(){
    const html = this.renderSnapshot(this._snap || this.montarSnapshot(this.datasDoInformativo()));
    let area = this.el('printArea');
    if(!area){ area = document.createElement('div'); area.id='printArea'; document.body.appendChild(area); }
    area.innerHTML = html;
    setTimeout(()=>window.print(), 120);
  },

  /* ---------------- publicar ---------------- */
  publicar(){
    const snap = this.montarSnapshot(this.datasDoInformativo());
    const pub = {id:uid(), tipo:this.infTipo, titulo:snap.titulo, datas:snap.datas,
      criado:agora(), usuario:DB.config.usuario, snapshot:snap};
    DB.publicacoes.unshift(pub);
    snap.blocos.forEach(b=>b.pessoas);
    DB.escalas.forEach(e=>{ if(snap.datas.includes(e.data)) e.publicado = true; });
    logar('publicação','publicar', snap.titulo, '', `${snap.blocos.length} quadro(s)`, '');
    salvar();
    this.modal(`<h3>Informativo publicado</h3>
      <div class="aviso s"><div>“${esc(snap.titulo)}” foi gerado e está disponível para consulta.</div></div>
      <div style="display:flex;gap:8px;flex-direction:column">
        <button class="btn pri" onclick="App.copiarLink('${pub.id}')">Copiar link de compartilhamento</button>
        <button class="btn" onclick="App.enviarWhats('${pub.id}')">Compartilhar no WhatsApp</button>
        <button class="btn" onclick="App.baixarInformativo('${pub.id}')">Baixar informativo (HTML)</button>
        <button class="btn" onclick="App.imprimir()">Imprimir / PDF</button>
        <button class="btn" onclick="App.fecharModal();App.ir('publicacoes')">Ver publicações</button>
      </div>`);
    this.publicacoes();
  },
  linkDe(pub){
    const dados = LZString.compressToEncodedURIComponent(JSON.stringify(pub.snapshot));
    return `${location.origin}${location.pathname}#p=${dados}`;
  },
  copiarLink(id){
    const pub = id ? DB.publicacoes.find(p=>p.id===id) : DB.publicacoes[0];
    if(!pub) return toast('Nada publicado ainda.');
    const link = this.linkDe(pub);
    navigator.clipboard.writeText(link).then(()=>toast('Link copiado.'))
      .catch(()=>{ this.modal(`<h3>Link</h3><textarea rows="6" onclick="this.select()">${esc(link)}</textarea>
        <div style="text-align:right;margin-top:10px"><button class="btn" onclick="App.fecharModal()">fechar</button></div>`); });
  },
  enviarWhats(id){
    const pub = id ? DB.publicacoes.find(p=>p.id===id) : (DB.publicacoes[0] || null);
    const snap = pub ? pub.snapshot : (this._snap || this.montarSnapshot(this.datasDoInformativo()));
    let txt = `*${snap.titulo}*\n`;
    if(snap.sobre) txt += `\n*Sobreaviso Rede* ${isoParaBR(snap.sobre.ini)} a ${isoParaBR(snap.sobre.fim)}\n${snap.sobre.tecnicos.map(t=>t.nome).join(' / ')}\n`;
    snap.blocos.forEach(b=>{
      txt += `\n*${(SETOR_NOME[b.setor]||b.setor).toUpperCase()} — ${nomeDia(b.data).toUpperCase()}*\n`;
      b.horarios.forEach(g=>{ txt += `${g.inicio?`${g.inicio} às ${g.fim}`:'horário não informado'}: ${g.pessoas.map(p=>p.nome).join(', ')}\n`; });
    });
    if(pub) txt += `\nInformativo completo: ${this.linkDe(pub)}`;
    window.open('https://wa.me/?text='+encodeURIComponent(txt), '_blank');
  },

  salvarFeriado(){
    const data = this.el('fData').value, nome = this.el('fNomeFer').value.trim();
    if(!data || !nome) return toast('Informe data e nome.');
    if(DB.feriados.some(f=>f.data===data)) return toast('Já existe feriado cadastrado nesta data.');
    DB.feriados.push({id:uid(), data, nome});
    logar('feriado','criar', `${isoParaBR(data)} ${nome}`,'','','');
    salvar(); this.fecharModal(); this.sobreaviso(); toast('Feriado cadastrado.');
  },
  excluirFeriado(id){
    if(!confirm('Excluir este feriado?')) return;
    DB.feriados = DB.feriados.filter(f=>f.id!==id); salvar(); this.sobreaviso();
  },
  abrirFeriado(data){ this.infTipo='feriado'; this.infData=data; this.ir('informativo'); },

  formAusencia(){
    const pessoas = DB.colaboradores.filter(c=>c.situacao!=='inativo');
    this.modal(`<h3>Registrar ausência</h3>
      <div class="campo"><label class="f">Data</label><input type="date" id="aData" value="${hojeISO()}"></div>
      <div class="campo"><label class="f">Colaborador</label>
        <select id="aColab">${pessoas.map(c=>`<option value="${esc(c.nome)}">${esc(c.nome)} — ${esc(SETOR_NOME[c.setor])}</option>`).join('')}</select></div>
      <div class="campo"><label class="f">Tipo</label>
        <select id="aTipo">${['ATESTADO','FERIAS','FOLGA','TROCA','SUBSTITUICAO','AUSENCIA'].map(t=>`<option value="${t}">${SIT_NOME[t]}</option>`).join('')}</select></div>
      <div class="campo"><label class="f">Motivo</label><input type="text" id="aMotivo" placeholder="atestado apresentado em..."></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn" onclick="App.fecharModal()">cancelar</button>
        <button class="btn pri" onclick="App.salvarAusencia()">registrar</button></div>`);
  },
  salvarAusencia(){
    const data = this.el('aData').value, nome = this.el('aColab').value,
      tipo = this.el('aTipo').value, motivo = this.el('aMotivo').value.trim();
    if(!data || !nome) return toast('Informe data e colaborador.');
    const antes = DB.escalas.filter(e=>e.data===data && norm(e.nome)===norm(nome));
    DB.ausencias.push({id:uid(), data, nome, tipo, motivo, usuario:DB.config.usuario, registro:agora()});
    antes.forEach(e=>{ e.situacao = tipo; e.inicio=''; e.fim=''; });
    logar('ausência','registrar', `${nome} em ${isoParaBR(data)}`, `${antes.length} turno(s)`, tipo, motivo);
    salvar(); this.fecharModal(); this.sobreaviso();
    toast(`Ausência registrada${antes.length?` e ${antes.length} turno(s) ajustado(s) apenas nesta data`:''}.`);
  },
  excluirAusencia(id){ DB.ausencias = DB.ausencias.filter(a=>a.id!==id); salvar(); this.sobreaviso(); },

  /* ---------------- histórico ---------------- */
  historico(){
    const h = `<div class="card"><div class="hd"><h3>Histórico de alterações</h3>
      <div class="acoes"><button class="btn sm" onclick="App.exportarTudo()">backup JSON</button></div></div>
      <div class="bd">
      ${DB.historico.length?`<div class="tbl-scroll"><table><thead><tr>
        <th>Data/hora</th><th>Usuário</th><th>Entidade</th><th>Ação</th><th>Alvo</th><th>Antes</th><th>Depois</th><th>Motivo</th>
        </tr></thead><tbody>${DB.historico.slice(0,300).map(x=>`<tr>
          <td class="mini">${esc(x.data)}</td><td class="small">${esc(x.usuario)}</td>
          <td><span class="bg az">${esc(x.entidade)}</span></td><td class="small">${esc(x.acao)}</td>
          <td class="small">${esc(x.alvo)}</td><td class="mini muted">${esc(x.antes)}</td>
          <td class="mini">${esc(x.depois)}</td><td class="mini muted">${esc(x.motivo)}</td></tr>`).join('')}
        </tbody></table></div>`
      :'<div class="muted small">Nenhuma alteração registrada.</div>'}
      </div></div>`;
    this.el('view-historico').innerHTML = h;
  }
});

/* ---------------- start ---------------- */
document.addEventListener('DOMContentLoaded', ()=>App.init());
</script>
</body>
</html>
