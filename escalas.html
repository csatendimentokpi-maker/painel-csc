<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Escalas CSC — Arroba Banda Larga</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
<style>
:root{
  --azul:#00439C; --azul-esc:#00306F; --azul-clr:#E8EFFA;
  --amarelo:#FBB900; --amarelo-clr:#FFF6DC;
  --branco:#FFFFFF; --cinza:#F4F5FA; --cinza-bd:#E3E6EF; --txt:#313131; --txt-clr:#6B7280;
  --verde:#198754; --vermelho:#DC3545; --laranja:#FD7E14;
  --r:12px; --sh:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--cinza);color:var(--txt);font-size:14px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:700}
a{color:var(--azul)}
button{font-family:inherit}
/* ---------- topo ---------- */
.topo{background:var(--azul);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:40;box-shadow:0 2px 10px rgba(0,48,111,.25)}
.marca{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--amarelo);display:grid;place-items:center;font-weight:800;color:var(--azul);font-size:15px;letter-spacing:-.5px}
.marca small{display:block;font-weight:400;opacity:.78;font-size:11px;letter-spacing:.4px;text-transform:uppercase}
.marca strong{font-size:15px;letter-spacing:.2px}
.topo .dir{margin-left:auto;display:flex;align-items:center;gap:8px}
.topo .who{font-size:12px;opacity:.85}
/* ---------- abas ---------- */
.abas{background:#fff;border-bottom:1px solid var(--cinza-bd);padding:0 12px;display:flex;gap:2px;overflow-x:auto;position:sticky;top:66px;z-index:30}
.abas::-webkit-scrollbar{height:0}
.aba{border:0;background:none;padding:13px 14px;font-size:13px;font-weight:600;color:var(--txt-clr);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.aba:hover{color:var(--azul);background:var(--azul-clr)}
.aba.on{color:var(--azul);border-bottom-color:var(--amarelo)}
/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 70px}
.view{display:none}
.view.on{display:block}
.card{background:#fff;border:1px solid var(--cinza-bd);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px;overflow:hidden}
.card>.hd{padding:13px 16px;border-bottom:1px solid var(--cinza-bd);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card>.hd h3{font-size:14px;letter-spacing:.2px}
.card>.hd .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card>.bd{padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}.wrap{padding:14px 10px 60px}.abas{top:auto;position:static}}
/* ---------- kpi ---------- */
.kpi{background:#fff;border:1px solid var(--cinza-bd);border-radius:var(--r);padding:14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--azul)}
.kpi.am:before{background:var(--amarelo)}
.kpi.vd:before{background:var(--verde)}
.kpi.vm:before{background:var(--vermelho)}
.kpi .rot{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--txt-clr);font-weight:700}
.kpi .val{font-size:26px;font-weight:800;color:var(--azul);margin-top:5px;line-height:1.1}
.kpi .sub{font-size:12px;color:var(--txt-clr);margin-top:4px}
/* ---------- botoes ---------- */
.btn{border:1px solid var(--cinza-bd);background:#fff;color:var(--txt);border-radius:9px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn:hover{border-color:var(--azul);color:var(--azul);background:var(--azul-clr)}
.btn.pri{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.pri:hover{background:var(--azul-esc);border-color:var(--azul-esc);color:#fff}
.btn.am{background:var(--amarelo);border-color:var(--amarelo);color:#3A2C00}
.btn.am:hover{filter:brightness(.95);color:#3A2C00}
.btn.dg{color:var(--vermelho);border-color:#F3C4CA}
.btn.dg:hover{background:#FDECEE;border-color:var(--vermelho);color:var(--vermelho)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* ---------- form ---------- */
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--cinza-bd);border-radius:9px;font-size:13px;font-family:inherit;background:#fff;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--azul-clr);border-color:var(--azul)}
label.f{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--txt-clr);margin-bottom:5px}
.campo{margin-bottom:12px}
/* ---------- tabela ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--azul);color:#fff;text-align:left;padding:10px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--cinza-bd);vertical-align:middle}
tbody tr:nth-child(even){background:#FAFBFE}
tbody tr:hover{background:var(--azul-clr)}
.tbl-scroll{overflow-x:auto}
/* ---------- badge ---------- */
.bg{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.bg.az{background:var(--azul-clr);color:var(--azul)}
.bg.am{background:var(--amarelo-clr);color:#8A6400}
.bg.vd{background:#E7F5EE;color:var(--verde)}
.bg.vm{background:#FDECEE;color:var(--vermelho)}
.bg.cz{background:#EEF0F5;color:var(--txt-clr)}
.bg.lr{background:#FFF1E5;color:#B35B00}
/* ---------- avatar ---------- */
.av{width:52px;height:52px;border-radius:50%;overflow:hidden;background:var(--azul-clr);display:grid;place-items:center;flex:0 0 auto;border:2px solid #fff;box-shadow:0 0 0 1px var(--cinza-bd)}
.av img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
.av b{color:var(--azul);font-size:16px;font-weight:800;letter-spacing:.5px}
.av.lg{width:76px;height:76px}
.av.sm{width:34px;height:34px}
.av.sm b{font-size:12px}
/* ---------- pessoas ---------- */
.slots{display:flex;flex-wrap:wrap;gap:12px}
.pessoa{display:flex;flex-direction:column;align-items:center;gap:6px;width:78px;text-align:center}
.pessoa .nm{font-size:11px;font-weight:600;line-height:1.2;color:var(--txt);word-break:break-word}
/* ---------- informativo ---------- */
.infor{background:#fff;border-radius:var(--r);overflow:hidden;border:1px solid var(--cinza-bd)}
.infor .capa{background:var(--azul);color:#fff;padding:26px 22px;text-align:center}
.infor .capa .sub{font-size:11px;letter-spacing:2.4px;text-transform:uppercase;opacity:.8;font-weight:700}
.infor .capa h2{font-size:23px;margin-top:8px;letter-spacing:.3px}
.infor .capa .faixa{width:78px;height:4px;background:var(--amarelo);border-radius:99px;margin:12px auto 0}
.infor .corpo{padding:18px}
.bloco{border:1px solid var(--cinza-bd);border-radius:10px;overflow:hidden;margin-bottom:14px;break-inside:avoid}
.bloco .bt{background:var(--azul);color:#fff;padding:9px 14px;font-size:12px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.bloco .bt .dta{margin-left:auto;font-size:10px;opacity:.85;letter-spacing:.5px}
.faixa-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--cinza-bd);flex-wrap:wrap}
.faixa-h:last-child{border-bottom:0}
.faixa-h .hr{background:var(--amarelo);color:#3A2C00;font-weight:800;font-size:12px;padding:5px 11px;border-radius:7px;white-space:nowrap;letter-spacing:.4px}
.bloco .vazio{padding:14px;color:var(--txt-clr);font-size:13px}
/* ---------- diversos ---------- */
.aviso{border-radius:10px;padding:11px 14px;font-size:13px;display:flex;gap:9px;align-items:flex-start;margin-bottom:14px}
.aviso.i{background:var(--azul-clr);color:#00306F}
.aviso.w{background:var(--amarelo-clr);color:#6B4E00}
.aviso.e{background:#FDECEE;color:#8A1F2B}
.aviso.s{background:#E7F5EE;color:#0F5132}
.muted{color:var(--txt-clr)}
.small{font-size:12px}
.mini{font-size:11px}
.list{display:flex;flex-direction:column;gap:9px}
.li{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--cinza-bd);border-radius:10px;background:#fff}
.li .nm{font-weight:600;font-size:13px}
.li .dir{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.sel{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.sel .campo{margin-bottom:0;min-width:150px;flex:1}
.hr-sep{height:1px;background:var(--cinza-bd);margin:14px 0}
.drop{border:2px dashed var(--cinza-bd);border-radius:12px;padding:30px 18px;text-align:center;background:#fff;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--azul);background:var(--azul-clr)}
.drop b{color:var(--azul)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
.toast.on{opacity:1;bottom:34px}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.55);display:none;place-items:center;z-index:150;padding:16px}
.modal.on{display:grid}
.modal .box{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:22px}
.modal h3{margin-bottom:14px;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dh{font-size:10px;text-align:center;color:var(--txt-clr);font-weight:800;text-transform:uppercase;padding:4px}
.cal .d{border:1px solid var(--cinza-bd);border-radius:8px;padding:6px 3px;text-align:center;cursor:pointer;min-height:46px;background:#fff;position:relative;transition:.12s}
.cal .d:hover{border-color:var(--azul)}
.cal .d .n{font-weight:700;font-size:13px}
.cal .d .t{font-size:9px;color:var(--verde);font-weight:700}
.cal .d.fd{background:#FBFCFE}
.cal .d.hoje{border-color:var(--azul);box-shadow:0 0 0 2px var(--azul-clr)}
.cal .d.sel{background:var(--azul);color:#fff}
.cal .d.sel .t{color:var(--amarelo)}
.cal .d.vaz{visibility:hidden}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--cinza);border:1px solid var(--cinza-bd);border-radius:99px;padding:3px 10px;font-size:11px;font-weight:600}
@media print{
  body{background:#fff}
  .topo,.abas,.no-print,.toast{display:none!important}
  .wrap{max-width:none;padding:0}
  .infor{border:0}
  .bloco{break-inside:avoid;page-break-inside:avoid}
  .card{box-shadow:none;border:0}
  #publog{display:block!important}
  .corpo{padding:0}
  @page{size:A4;margin:12mm}
}
</style>
</head>
<body>

<div class="topo no-print">
  <div class="marca">
    <div class="logo">AB</div>
    <div>
      <strong>Painel de Escalas CSC</strong>
      <small>Arroba Banda Larga</small>
    </div>
  </div>
  <div class="dir">
    <span class="who" id="topoUser">Administrador</span>
    <button class="btn sm am" onclick="App.exportarTudo()">Backup JSON</button>
  </div>
</div>

<nav class="abas no-print" id="abas">
  <button class="aba on" data-v="dashboard">Painel</button>
  <button class="aba" data-v="importar">Importar escala</button>
  <button class="aba" data-v="conferencia">Conferência <span id="badgeConf"></span></button>
  <button class="aba" data-v="colaboradores">Colaboradores</button>
  <button class="aba" data-v="informativo">Informativo</button>
  <button class="aba" data-v="sobreaviso">Sobreaviso e feriados</button>
  <button class="aba" data-v="publicacoes">Publicações</button>
  <button class="aba" data-v="historico">Histórico</button>
</nav>

<div class="wrap">
  <div class="view on" id="view-dashboard"></div>
  <div class="view" id="view-importar"></div>
  <div class="view" id="view-conferencia"></div>
  <div class="view" id="view-colaboradores"></div>
  <div class="view" id="view-informativo"></div>
  <div class="view" id="view-sobreaviso"></div>
  <div class="view" id="view-publicacoes"></div>
  <div class="view" id="view-historico"></div>
</div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<script>
/* =========================================================================
   PAINEL DE ESCALAS CSC — ARROBA BANDA LARGA
   Núcleo: armazenamento, utilidades, leitura de planilhas
   ========================================================================= */
const CHAVE = 'painel_escalas_csc_v1';
const SETORES = ['CSC','VENDAS','MANUTENCAO','SOBREAVISO','QUALIDADE','FINANCEIRO'];
const SETOR_NOME = {CSC:'CSC — Atendimento',VENDAS:'Vendas',MANUTENCAO:'Manutenção',
  SOBREAVISO:'Sobreaviso de Rede',QUALIDADE:'Qualidade',FINANCEIRO:'Financeiro'};
const SITUACOES = ['TRABALHO','FOLGA','FERIAS','ATESTADO','FOLGA_FERIADO','TROCA','SUBSTITUICAO','AUSENCIA'];
const SIT_NOME = {TRABALHO:'Trabalho',FOLGA:'Folga',FERIAS:'Férias',ATESTADO:'Atestado',
  FOLGA_FERIADO:'Folga feriado',TROCA:'Troca',SUBSTITUICAO:'Substituição',AUSENCIA:'Ausência'};

var DB = null;
/* atalho global para mensagens (usado também fora do objeto App) */
function toast(msg){ if(window.App && typeof App.toast === 'function') App.toast(msg); }

/* ------------------------------ utilidades ------------------------------ */
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const agora = () => new Date().toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'});
const hojeISO = () => new Date().toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'});

function norm(s){
  return String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/\s+/g,' ').trim();
}
function esc(s){
  return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function iniciais(nome){
  const p = String(nome||'').trim().split(/\s+/).filter(Boolean);
  if(!p.length) return '?';
  return (p[0][0] + (p.length>1 ? p[p.length-1][0] : '')).toUpperCase();
}
function isoParaBR(iso){
  if(!iso) return '';
  const [a,m,d] = String(iso).slice(0,10).split('-');
  return (d&&m&&a) ? `${d}/${m}/${a}` : String(iso);
}
function brParaISO(br){
  if(!br) return '';
  const s = String(br).trim();
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){ let a = m[3].length===2 ? '20'+m[3] : m[3]; return `${a}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  // serial do Excel
  if(/^\d{5}$/.test(s)){ return serialParaISO(Number(s)); }
  return '';
}
function serialParaISO(serial){
  const base = Date.UTC(1899,11,30);
  const d = new Date(base + serial*86400000);
  return d.toISOString().slice(0,10);
}
function dataDeQualquer(v){
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  if(typeof v === 'number') return serialParaISO(v);
  return brParaISO(v);
}
const DIAS_SEM = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const DIAS_CUR = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function diaSemana(iso){ const d = new Date(iso+'T12:00:00'); return d.getDay(); }
function nomeDia(iso){ return DIAS_SEM[diaSemana(iso)]; }
function addDias(iso, n){
  const d = new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function segDaSemana(iso){
  const w = diaSemana(iso);
  return addDias(iso, -(w===0?6:w-1));
}
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

/* ------------------------------ horários ------------------------------ */
/* Aceita: 08h-13h | 08:00/13:00 | 08H ÀS 13H | 18h-00h | 12-16 | 18h30-23h30 */
function parseHorario(txt){
  const raw = String(txt??'').trim();
  if(!raw) return null;
  const t = norm(raw).toUpperCase();
  if(/^(folga|folgas|descanso|off|-$|—)?$/.test(t) && !/\d/.test(t)) return null;
  const toks = raw.match(/\d{1,2}(?:[:hH]\d{2})?/g);
  if(!toks || toks.length < 2) return null;
  const hm = s => {
    const m = String(s).match(/^(\d{1,2})(?:[:hH](\d{2}))?$/);
    if(!m) return null;
    let h = parseInt(m[1],10); const mi = m[2] ? parseInt(m[2],10) : 0;
    if(h>23 || mi>59) return null;
    return {h, mi, txt: String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')};
  };
  const a = hm(toks[0]), b = hm(toks[1]);
  if(!a || !b) return null;
  return {ini:a.txt, fim:b.txt, iniMin:a.h*60+a.mi, fimMin:b.h*60+b.mi};
}
function situacaoDe(txt){
  const t = norm(txt).toUpperCase();
  if(/^$/.test(t)) return null;
  if(/\bFOLGA\b/.test(t) && /FERIADO/.test(t)) return 'FOLGA_FERIADO';
  if(/FOLGA|DESCANSO|\bOFF\b/.test(t)) return 'FOLGA';
  if(/FERIAS/.test(t)) return 'FERIAS';
  if(/ATESTADO|LICENCA MEDICA|MEDICO/.test(t)) return 'ATESTADO';
  if(/TROCA/.test(t)) return 'TROCA';
  if(/SUBSTITU/.test(t)) return 'SUBSTITUICAO';
  if(/AUSENCIA|FALTOU|FALTA/.test(t)) return 'AUSENCIA';
  if(/^(SIM|S|X|1)$/.test(t)) return 'TRABALHO';
  if(/^(NAO|N)$/.test(t)) return null;
  if(/TRABALHO|EXPEDIENTE|PLANTAO/.test(t)) return 'TRABALHO';
  return null;
}
/* Separa vários nomes na mesma célula */
function separarNomes(txt){
  let s = String(txt??'').trim();
  if(!s) return [];
  s = s.replace(/\s+e\s+(?=[A-ZÀ-Ú])/gu, ', ');      // "Kayke e Camily"
  return s.split(/[,;\/|\n]+/).map(x=>x.trim()).filter(x=>{
    if(!x) return false;
    const n = norm(x).toUpperCase();
    if(/^(SIM|NAO|S|N|X|1|0|TRABALHO|FOLGA|FERIAS|ATESTADO|EXPEDIENTE)$/.test(n)) return false;
    return /[A-Za-zÀ-ÿ]{2,}/.test(x);
  });
}

/* ------------------------------ persistência ------------------------------ */
function dbVazio(){
  return {versao:1, colaboradores:[], escalas:[], sobreavisos:[], feriados:[],
    ausencias:[], publicacoes:[], importacoes:[], pendentes:[], historico:[],
    config:{usuario:'Administrador', perfil:'Administrador'}, seed:false};
}
function carregar(){
  try{
    const raw = localStorage.getItem(CHAVE);
    DB = raw ? JSON.parse(raw) : dbVazio();
  }catch(e){ DB = dbVazio(); }
  if(!DB.colaboradores) DB.colaboradores=[];
  if(!DB.escalas) DB.escalas=[];
  if(!DB.pendentes) DB.pendentes=[];
  if(!DB.historico) DB.historico=[];
  if(!DB.publicacoes) DB.publicacoes=[];
  if(!DB.importacoes) DB.importacoes=[];
  if(!DB.sobreavisos) DB.sobreavisos=[];
  if(!DB.feriados) DB.feriados=[];
  if(!DB.ausencias) DB.ausencias=[];
  if(!DB.config) DB.config={usuario:'Administrador',perfil:'Administrador'};
  if(!DB.seed){ semearColaboradores(); DB.seed = true; }
  salvar();
}
function salvar(){
  try{ localStorage.setItem(CHAVE, JSON.stringify(DB)); }
  catch(e){ toast('Não foi possível salvar: armazenamento cheio. Reduza o tamanho das fotos.'); }
}
function logar(entidade, acao, alvo, antes, depois, motivo){

/* Casa nome da planilha com cadastro — SOMENTE exato (nome, exibição, código, apelido).
   Nunca por semelhança, para não confundir Jhenifer Nunes (CSC) com Jhennifer (Vendas). */
function acharColaborador(nome, setor){
  const n = norm(nome);
  if(!n) return null;
  const cand = DB.colaboradores.filter(c=>c.situacao!=='inativo');
  const bate = c => norm(c.nome)===n || norm(c.exibicao)===n || norm(c.codigo)===n
    || (c.apelidos||[]).some(a=>norm(a)===n);
  const exatos = cand.filter(bate);
  if(!exatos.length) return null;
  if(exatos.length===1) return exatos[0];
  if(setor){ const doSetor = exatos.filter(c=>c.setor===setor); if(doSetor.length===1) return doSetor[0]; }
  return exatos[0];
}
function colaboradorPorId(id){ return DB.colaboradores.find(c=>c.id===id) || null; }

<script>
/* =========================================================================
   LEITURA DE PLANILHAS
   ========================================================================= */
var Importador = {
  setorPadrao: 'CSC',
  arquivos: [],
  matrizLida: [],

  normalizarSetor(v){
    const t = norm(v).toUpperCase();
    if(!t) return null;
    if(/^CSC|ATENDIMENTO|SUPORTE|PREFERENCIAL|CEI/.test(t)) return 'CSC';
    if(/VENDAS|COMERCIAL/.test(t)) return 'VENDAS';
    if(/MANUTEN|TECNIC|CAMPO/.test(t)) return 'MANUTENCAO';
    if(/SOBREAVISO|REDE|PROJETO|NOC/.test(t)) return 'SOBREAVISO';
    if(/QUALIDADE/.test(t)) return 'QUALIDADE';
    if(/FINANC|COBRAN|RETEN|REVERS|RENOVA|TROCA/.test(t)) return 'FINANCEIRO';
    return null;
  },

  async lerArquivo(file){
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(new Uint8Array(buf), {type:'array', cellDates:true});
    const abas = [];
    wb.SheetNames.forEach(nome=>{
      const ws = wb.Sheets[nome];
      const matriz = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null, blankrows:false});
      const limpa = matriz.filter(l=>l && l.some(c=>c!==null && String(c).trim()!==''));
      if(limpa.length>1) abas.push({nome, matriz:limpa});
    });
    return abas;
  },

  detectar(aba){
    const {nome, matriz} = aba;
    const header = (matriz[0]||[]).map(h=>norm(h));
    const hn = norm(nome);
    if(/COLABORADOR|EQUIPE|CADASTRO/.test(hn)) return 'cadastro';
    if(/SOBREAVISO|PLANTAO|REDE/.test(hn)) return 'sobreaviso';
    if(/FERIADO/.test(hn)) return 'tabela';
    const temData = header.some(h=>/^data|^dia$|^dt/.test(h));
    const temNome = header.some(h=>/colaborador|nome|agente|tecnico/.test(h));
    const temHora = header.some(h=>/horario|inicio|entrada|hora/.test(h));
    if(temData && temNome && temHora) return 'tabela';
    const datasNoHeader = (matriz[0]||[]).filter(c=>dataDeQualquer(c)).length;
    if(datasNoHeader>=2) return 'matriz';
    const datasNaColuna = matriz.filter(l=>dataDeQualquer(l[0])).length;
    if(datasNaColuna>=2) return 'transposta';
    if(temData && temNome) return 'tabela';
    return 'desconhecido';
  },

  /* ---------- formato TABELA: uma linha por horário/setor ---------- */
  parseTabela(aba){
    const matriz = aba.matriz;
    const header = (matriz[0]||[]).map(h=>norm(h));
    const idx = (re, alt) => {
      let i = header.findIndex(h=>re.test(h));
      if(i<0 && alt) i = header.findIndex(h=>alt.test(h));
      return i;
    };
    const iData = idx(/^data$|^dia$|^dt/);
    const iSetor = idx(/setor|area|departamento/);
    const iHi = idx(/horario.?inicio|hora.?inicio|^inicio$|^entrada$/);
    const iHf = idx(/horario.?fim|hora.?fim|^fim$|^saida$|termino/);
    const iHoraUnica = idx(/^horario$|^turno$|^hora$/);
    const iCol = idx(/colaborador|^nome$|agente|tecnico/);
    const iSit = idx(/situacao|status|observ/);
    const registros = [], avisos = [];
    for(let r=1; r<matriz.length; r++){
      const linha = matriz[r]||[];
      const data = dataDeQualquer(linha[iData]);
      const setorBruto = iSetor>=0 ? linha[iSetor] : '';
      const setor = this.normalizarSetor(setorBruto) || this.setorPadrao;
      const nomesBrutos = iCol>=0 ? linha[iCol] : linha.slice(1).join(', ');
      const nomes = separarNomes(nomesBrutos);
      const sitBruta = iSit>=0 ? linha[iSit] : '';
      let situacao = situacaoDe(sitBruta);
      let hor = null;
      if(iHi>=0 && iHf>=0) hor = parseHorario(`${linha[iHi]??''}-${linha[iHf]??''}`);
      if(!hor && iHoraUnica>=0) hor = parseHorario(linha[iHoraUnica]);
      if(!situacao && hor) situacao = 'TRABALHO';
      if(!data){
        if(nomes.length) avisos.push(`Aba "${aba.nome}", linha ${r+1}: data não identificada.`);
        continue;
      }
      if(!nomes.length){
        if(situacao) avisos.push(`Aba "${aba.nome}", linha ${r+1}: ${SIT_NOME[situacao]} sem colaborador (ignorada).`);
        continue;
      }
      nomes.forEach(nome=>{
        registros.push(this.montar({data, setor, nome, hor, situacao,
          aba:aba.nome, linha:r+1, avisos}));
      });
    }
    return {registros, avisos};
  },

  /* ---------- formato MATRIZ: colaboradores nas linhas, datas nas colunas ---------- */
  parseMatriz(aba){
    const matriz = aba.matriz;
    const header = matriz[0]||[];
    const colsData = [];
    header.forEach((c,i)=>{ const d = dataDeQualquer(c); if(d && i>0) colsData.push({i, data:d}); });
    const iSetor = header.findIndex(h=>/setor|area|departamento/i.test(norm(h)));
    const registros = [], avisos = [];
    for(let r=1; r<matriz.length; r++){
      const linha = matriz[r]||[];
      const nome = String(linha[0]??'').trim();
      if(!nome || /^(total|setor|colaborador)$/i.test(nome)) continue;
      const setor = this.normalizarSetor(iSetor>=0 ? linha[iSetor] : '') || this.setorPadrao;
      colsData.forEach(({i,data})=>{
        const cel = linha[i];
        if(cel===null || cel===undefined || String(cel).trim()==='') return;
        const hor = parseHorario(cel);
        const situacao = situacaoDe(cel) || (hor ? 'TRABALHO' : null);
        if(!situacao && !hor){
          avisos.push(`Aba "${aba.nome}", ${nome} em ${isoParaBR(data)}: conteúdo "${String(cel).trim()}" não reconhecido.`);
          return;
        }
        separarNomes(nome).forEach(n=>{
          registros.push(this.montar({data, setor, nome:n, hor, situacao, aba:aba.nome, linha:r+1, avisos}));
        });
      });
    }
    return {registros, avisos};
  },

  /* ---------- formato TRANSPOSTA: dias nas linhas, nomes nas colunas ---------- */
  parseTransposta(aba){
    const matriz = aba.matriz;
    const header = matriz[0]||[];
    const colsNome = [];
    header.forEach((c,i)=>{ if(i>0 && c && !dataDeQualquer(c)) colsNome.push({i, nome:String(c).trim()}); });
    const registros = [], avisos = [];
    for(let r=1; r<matriz.length; r++){
      const linha = matriz[r]||[];
      const data = dataDeQualquer(linha[0]);
      if(!data) continue;
      colsNome.forEach(({i,nome})=>{
        const cel = linha[i];
        if(cel===null || cel===undefined || String(cel).trim()==='') return;
        const hor = parseHorario(cel);
        const situacao = situacaoDe(cel) || (hor ? 'TRABALHO' : null);
        if(!situacao && !hor) return;
        separarNomes(nome).forEach(n=>{
          registros.push(this.montar({data, setor:this.setorPadrao, nome:n, hor, situacao,
            aba:aba.nome, linha:r+1, avisos}));
        });
      });
    }
    return {registros, avisos};
  },

  parseCadastro(aba){
    const matriz = aba.matriz;
    const header = (matriz[0]||[]).map(h=>norm(h));
    const i = re => header.findIndex(h=>re.test(h));
    const iCod=i(/codigo|cod|matricula|id/), iNome=i(/nome.?completo|^nome$|colaborador/),
      iExib=i(/exibicao|apelido.?exib/), iSetor=i(/setor|area/), iApel=i(/apelido|variacao|grafia/),
      iSit=i(/situacao|status/), iJor=i(/jornada|turno|horario/);
    const pessoas = [];
    for(let r=1; r<matriz.length; r++){
      const l = matriz[r]||[];
      const nome = String((iNome>=0?l[iNome]:l[1])??'').trim();
      if(!nome) continue;
      pessoas.push({codigo:String((iCod>=0?l[iCod]:'')??'').trim(), nome,
        exibicao:String((iExib>=0?l[iExib]:'')??'').trim()||nome,
        setor:this.normalizarSetor(iSetor>=0?l[iSetor]:'')||this.setorPadrao,
        apelidos:String((iApel>=0?l[iApel]:'')??'').split(/[,;]/).map(s=>s.trim()).filter(Boolean),
        situacao:iSit>=0 && /inativ/i.test(String(l[iSit]??'')) ? 'inativo':'ativo',
        jornada:String((iJor>=0?l[iJor]:'')??'').trim()});
    }
    return pessoas;
  },

  parseSobreaviso(aba){
    const matriz = aba.matriz;
    const header = (matriz[0]||[]).map(h=>norm(h));
    const i = re => header.findIndex(h=>re.test(h));
    const iIni=i(/inicial|inicio|de/), iFim=i(/final|fim|ate/), iTec=i(/tecnico|colaborador|nome/),
      iObs=i(/observ|nota/);
    const out = [];
    for(let r=1; r<matriz.length; r++){
      const l = matriz[r]||[];
      const ini = dataDeQualquer(iIni>=0?l[iIni]:l[0]);
      const fim = dataDeQualquer(iFim>=0?l[iFim]:l[1]);
      const tec = separarNomes(iTec>=0?l[iTec]:l[2]);
      if(!ini || !fim) continue;
      out.push({ini, fim, tecnicos:tec, obs:String((iObs>=0?l[iObs]:'')??'')});
    }
    return out;
  },

  montar({data, setor, nome, hor, situacao, aba, linha, avisos}){
    const col = acharColaborador(nome, setor);
    let problema = '';
    if(!col) problema = 'Colaborador não cadastrado';
    else if(col.setor !== setor && setor && col.setor) {
      if(col.setor!==setor) problema = `Setor da planilha (${SETOR_NOME[setor]}) difere do cadastro (${SETOR_NOME[col.setor]})`;
    }
    if(situacao==='TRABALHO' && !hor) problema = problema || 'Horário não identificado';
    if(situacao==='TRABALHO' && !setor) problema = problema || 'Setor não identificado';
    return {i:uid(), data, setor, nome, colaboradorId: col?col.id:null,
      inicio: hor?hor.ini:'', fim: hor?hor.fim:'', situacao: situacao||'TRABALHO',
      aba, linha, problema, incluir:true};
  },

  /* monta os pendentes de todos os arquivos escolhidos */
  processar(abas){
    let regs = [], avisos = [], cadastros = [], sobreavisos = [], abasInfo = [];
    abas.forEach(aba=>{
      const tipo = this.detectar(aba);
      abasInfo.push({aba:aba.nome, tipo});
      if(tipo==='cadastro'){
        const p = this.parseCadastro(aba); cadastros = cadastros.concat(p);
      } else if(tipo==='sobreaviso'){
        sobreavisos = sobreavisos.concat(this.parseSobreaviso(aba));
      } else if(tipo==='tabela'){
        const r = this.parseTabela(aba); regs = regs.concat(r.registros); avisos = avisos.concat(r.avisos);
      } else if(tipo==='matriz'){
        const r = this.parseMatriz(aba); regs = regs.concat(r.registros); avisos = avisos.concat(r.avisos);
      } else if(tipo==='transposta'){
        const r = this.parseTransposta(aba); regs = regs.concat(r.registros); avisos = avisos.concat(r.avisos);
      } else {
        avisos.push(`Aba "${aba.nome}": estrutura não reconhecida. Precisa de mapeamento manual.`);
      }
    });
    this.marcarConflitos(regs);
    return {registros:regs, avisos, cadastros, sobreavisos, abasInfo};
  },

  marcarConflitos(regs){
    const vistos = new Map();
    regs.forEach(r=>{
      if(r.situacao!=='TRABALHO') return;
      const k = `${r.colaboradorId||norm(r.nome)}|${r.data}`;
      if(!vistos.has(k)) vistos.set(k, []);
      vistos.get(k).push(r);
    });
    vistos.forEach(lista=>{
      for(let a=0; a<lista.length; a++){
        for(let b=a+1; b<lista.length; b++){
          const A=lista[a], B=lista[b];
          const iniA=parseHorario(A.inicio+'-'+A.fim), iniB=parseHorario(B.inicio+'-'+B.fim);
          if(!iniA||!iniB) continue;
          const mesmo = iniA.ini===iniB.ini && iniA.fim===iniB.fim;
          const sobrepoe = iniA.iniMin < (iniB.fimMin||1440) && iniB.iniMin < (iniA.fimMin||1440);
          if(mesmo){ A.duplicado = B.duplicado = true; A.problema = A.problema || 'Registro duplicado'; B.problema = B.problema || 'Registro duplicado'; }
          else if(sobrepoe){ A.conflito = B.conflito = true; A.problema = A.problema || 'Horário conflitante no mesmo dia'; B.problema = B.problema || 'Horário conflitante no mesmo dia'; }
        }
      }
    });
  }
};
